---
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 06:00 UTC — picks up new CVE/policy definitions even when
    # no code changed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: trivy (iac + secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # trivy-action and the trivy binary were both compromised via moved tags
      # in 2026 (March 2026 force-push; binary v0.69.4 was the malicious
      # release). Both stay pinned to immutable references — the action to a
      # full commit SHA, the binary to an exact `version` — and Renovate keeps
      # both pins current from there.
      - name: Trivy filesystem scan (misconfig + secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          format: sarif
          output: trivy-results.sarif
          version: v0.72.0
          # Soft-launch: report findings to the Security tab, do not block PRs.
          # Harden later with exit-code "1" + severity: HIGH,CRITICAL.
          exit-code: "0"
      - name: Upload Trivy SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: trivy-results.sarif
