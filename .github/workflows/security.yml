---
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly Monday 06:00 UTC — picks up new CVE/policy definitions even when
    # no code changed.
    - cron: "0 6 * * 1"
  # Manual full scan of every deployed image (same scope as the weekly run).
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: trivy (iac + secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # trivy-action and the trivy binary were both compromised via moved tags
      # in 2026 (March 2026 force-push; binary v0.69.4 was the malicious
      # release). Both stay pinned to immutable references — the action to a
      # full commit SHA, the binary to an exact `version` — and Renovate keeps
      # both pins current from there.
      - name: Trivy filesystem scan (misconfig + secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          format: sarif
          output: trivy-results.sarif
          version: v0.76.2
          # Report only what is worth acting on. Without
          # limit-severities-for-sarif the action drops the severity filter
          # for SARIF output and uploads every LOW/MEDIUM finding as an alert.
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          # This step only feeds the Security tab; the gate below decides
          # whether the job fails.
          exit-code: "0"
      - name: Upload Trivy SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
      # Blocking part: any HIGH/CRITICAL misconfiguration or secret that is
      # not listed in the baseline fails the job. The baseline holds the
      # hardening debt that already existed (per file), so new workloads and
      # new kinds of findings are caught while the old ones stay visible in
      # the Security tab. To make the scan report-only again, set exit-code
      # to "0" here.
      - name: Trivy gate (new HIGH/CRITICAL findings fail the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          format: table
          version: v0.76.2
          severity: HIGH,CRITICAL
          trivyignores: .github/trivy-gate-baseline.yaml
          # The SARIF report written above is not source code.
          skip-files: trivy-results.sarif
          exit-code: "1"

  discover-images:
    name: discover deployed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.collect.outputs.images }}
      categories: ${{ steps.collect.outputs.categories }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Determine which charts to scan
        id: charts
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Pull requests and pushes to main: only the charts that changed.
          # Every deployed image is scanned by the weekly schedule and by a
          # manual run (new CVEs for unchanged images) — a full scan on every
          # push meant ~55 jobs per merge for images that had not changed.
          case "${EVENT_NAME}" in
            pull_request)
              changed="$(ct list-changed --config .github/ct.yaml)"
              ;;
            push)
              # ct compares against the target branch, which on main is HEAD
              # itself — diff the pushed range instead. A merge commit's range
              # covers everything the pull request brought in.
              base="${PUSH_BEFORE}"
              if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
                base="HEAD^"
              fi
              changed="$(git diff --name-only "${base}" HEAD -- argocd/apps \
                | awk -F/ 'NF > 3 { print $1 "/" $2 "/" $3 }' | sort -u)"
              ;;
            *)
              echo "Full scan (${EVENT_NAME})."
              echo "dirs=all" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ -z "${changed}" ]; then
            echo "No changed charts — skipping image scan."
            echo "dirs=" >> "$GITHUB_OUTPUT"
          else
            echo "Changed charts:"
            # shellcheck disable=SC2086  # intentional word-splitting: one chart per line
            printf '  %s\n' ${changed}
            # GITHUB_OUTPUT does not allow newlines in key=value format;
            # replace them with spaces (word-splitting in the render step handles both).
            changed_oneline="$(echo "${changed}" | tr '\n' ' ')"
            echo "dirs=${changed_oneline}" >> "$GITHUB_OUTPUT"
          fi
      - name: Render charts
        if: steps.charts.outputs.dirs != ''
        env:
          CHART_DIRS: ${{ steps.charts.outputs.dirs }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          if [ "${CHART_DIRS}" = "all" ]; then
            chart_list="$(find argocd/apps -maxdepth 1 -mindepth 1 -type d)"
          else
            chart_list="${CHART_DIRS}"
          fi
          # A chart that cannot be rendered drops out of the scan without a
          # trace, and the run would still look complete. Fail instead — but
          # only after trying every chart, so one log shows all broken ones.
          failed=""
          for chart_dir in ${chart_list}; do
            # Skips non-chart apps (kustomize, raw YAML) and, on push, the
            # directory of a chart that this push deleted.
            [ -f "${chart_dir}/Chart.yaml" ] || continue
            name="$(basename "${chart_dir%/}")"
            if grep -q '^dependencies:' "${chart_dir}/Chart.yaml"; then
              if ! helm dependency update "$chart_dir"; then
                echo "::error::helm dependency update failed for ${chart_dir}"
                failed="${failed} ${name}"
                continue
              fi
            fi
            if ! helm template "$name" "$chart_dir" > "/tmp/rendered/${name}.yaml" 2>/tmp/rendered/"${name}.stderr"; then
              echo "::error::helm template failed for ${chart_dir}"
              cat "/tmp/rendered/${name}.stderr" >&2
              rm -f "/tmp/rendered/${name}.yaml"
              failed="${failed} ${name}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "Charts that could not be rendered:${failed}" >&2
            exit 1
          fi
      - name: Extract unique container images from rendered manifests
        id: collect
        env:
          CHART_DIRS: ${{ steps.charts.outputs.dirs }}
        run: |
          set -euo pipefail
          if [ "${CHART_DIRS}" = "" ] || [ ! -d /tmp/rendered ] || [ -z "$(ls -A /tmp/rendered 2>/dev/null)" ]; then
            echo "images=[]" >> "$GITHUB_OUTPUT"
            echo "categories={}" >> "$GITHUB_OUTPUT"
          else
            # {image: SARIF category}; the category is derived from the image
            # name without tag (see the script) so it survives version bumps.
            python3 .github/scripts/discover_images.py --categories /tmp/rendered > /tmp/categories.json
            python3 -c 'import json; [print(c, i) for i, c in sorted(json.load(open("/tmp/categories.json")).items())]'
            images="$(python3 -c 'import json; print(json.dumps(sorted(json.load(open("/tmp/categories.json")))))')"
            echo "images=${images}" >> "$GITHUB_OUTPUT"
            echo "categories=$(cat /tmp/categories.json)" >> "$GITHUB_OUTPUT"
          fi

  trivy-image:
    name: trivy (image vulnerabilities)
    needs: discover-images
    if: needs.discover-images.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.discover-images.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      # Same pinning rationale as the fs scan above (immutable action SHA +
      # exact trivy binary version).
      # A scan error (as opposed to findings) — typically an image that can no
      # longer be pulled from its registry — must not turn the soft-launch scan
      # red. Surface it as a warning instead so it stays visible.
      - name: Trivy image scan
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-image-results.sarif
          version: v0.76.2
          # Only findings that can be acted on: HIGH/CRITICAL with a fix
          # available. limit-severities-for-sarif makes the severity filter
          # apply to SARIF output too (the action drops it otherwise).
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
          # Report-only: CVEs in third-party images are fixed by upstream
          # releases (Renovate), not by failing this repository's PRs.
          exit-code: "0"
      - name: Warn on scan error
        if: steps.scan.outcome == 'failure'
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "::warning::Trivy could not scan ${IMAGE} (image unpullable or scanner error) — no results uploaded"
      - name: Upload Trivy SARIF to the Security tab
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image-results.sarif
          # Stable per image name — not the matrix index, which shifts as
          # soon as an image is added or removed.
          category: ${{ fromJson(needs.discover-images.outputs.categories)[matrix.image] }}
