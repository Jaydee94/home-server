---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job names below MUST stay as "yamllint" and "helm lint (all charts)" because
# the branch-protection rule on main requires those exact status-check names.

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Pinned (not "3.x"): a new Python release must not turn the required
          # checks red on its own. Renovate keeps it below the ceiling set in
          # renovate.json.
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-yamllint-${{ runner.os }}-${{ hashFiles('.github/requirements-yamllint.txt') }}
      - name: Install yamllint
        run: pip install -r .github/requirements-yamllint.txt
      # Lint the whole repo, not just changed files: a pre-existing error in an
      # untouched file otherwise stays invisible until an unrelated PR (usually
      # Renovate) happens to touch that file and turns red for it. Takes seconds.
      # Keep the paths in sync with the "lint" target in the Makefile.
      - name: Run yamllint
        run: yamllint -c .yamllint ansible/ argocd/ .github/

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Do not use "3.x": it resolved to 3.15, which ansible-core did not
          # support yet. Renovate keeps this below the ceiling in renovate.json.
          python-version: "3.13"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-ansible-${{ runner.os }}-${{ hashFiles('.github/requirements-ansible.txt') }}
      - name: Install ansible + ansible-lint
        run: pip install -r .github/requirements-ansible.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}
      - name: Install required collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Run ansible-lint
        run: ansible-lint ansible/

  helm-lint:
    name: helm lint (all charts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: Detect changed charts
        id: list-changed
        run: |
          set -euo pipefail
          changed="$(ct list-changed --config .github/ct.yaml)"
          if [ -n "${changed}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed charts:"
            # shellcheck disable=SC2086  # intentional word-splitting: one chart per line
            printf '  %s\n' ${changed}
          else
            echo "No changed Helm charts — nothing to lint."
          fi
      - name: helm lint changed charts
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config .github/ct.yaml

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true
