---
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job names below MUST stay as "yamllint" and "helm lint (all charts)" because
# the branch-protection rule on main requires those exact status-check names.

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-yamllint-${{ runner.os }}-${{ hashFiles('.github/workflows/lint.yml') }}
      - name: Install yamllint
        run: pip install yamllint
      # Lint the whole repo, not just changed files: a pre-existing error in an
      # untouched file otherwise stays invisible until an unrelated PR (usually
      # Renovate) happens to touch that file and turns red for it. Takes seconds.
      # Keep the paths in sync with the "lint" target in the Makefile.
      - name: Run yamllint
        run: yamllint -c .yamllint ansible/ argocd/ .github/

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # "3.x" resolves to 3.15, which ansible-core does not support yet
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-ansible-${{ runner.os }}-${{ hashFiles('.github/workflows/lint.yml') }}
      - name: Install ansible + ansible-lint
        run: pip install ansible ansible-lint
      - uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml') }}
      - name: Install required collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Run ansible-lint
        run: ansible-lint ansible/

  helm-lint:
    name: helm lint (all charts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
      - name: Detect changed charts
        id: list-changed
        run: |
          set -euo pipefail
          changed="$(ct list-changed --config .github/ct.yaml)"
          if [ -n "${changed}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed charts:"
            # shellcheck disable=SC2086  # intentional word-splitting: one chart per line
            printf '  %s\n' ${changed}
          else
            echo "No changed Helm charts — nothing to lint."
          fi
      - name: helm lint changed charts
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config .github/ct.yaml

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true
