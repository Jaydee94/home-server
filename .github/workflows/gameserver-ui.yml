---
name: gameserver-ui

"on":
  pull_request:
    paths:
      - "apps/gameserver-ui/**"
      - ".github/workflows/gameserver-ui.yml"
  push:
    branches: [main]
    paths:
      - "apps/gameserver-ui/**"
      - ".github/workflows/gameserver-ui.yml"
  workflow_dispatch: {}

# No token permissions by default; every job asks for exactly what it needs.
permissions: {}

# PRs: a newer push replaces the running check. main / manual runs: queue and
# never cancel, so two quick merges build one after the other and the image of
# the later merge is the one "stable" ends up pointing at.
concurrency:
  group: gameserver-ui-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/gameserver-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/gameserver-ui/package-lock.json
      - run: npm ci
      # Type check instead of a full `next build`: the production build runs
      # exactly once per event, inside the Docker build below. `next typegen`
      # writes next-env.d.ts and the route types that tsc needs (both are
      # gitignored and otherwise only appear after a build).
      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit
      - run: npm run test

  # Pull requests (and manual runs from a branch other than main): build the
  # image to prove the Dockerfile and `next build` still work, but push
  # nothing and hold no registry credentials.
  build:
    name: build image (no push)
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/gameserver-ui
          push: false
          # Read the layer cache written by builds on main; do not write one
          # per PR branch (the repository cache is limited to 10 GB).
          cache-from: type=gha,scope=gameserver-ui

  build-push:
    name: build and push image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/jaydee94/gameserver-ui
          tags: |
            type=sha,format=short
            type=raw,value=stable
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: apps/gameserver-ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gameserver-ui
          cache-to: type=gha,scope=gameserver-ui,mode=max
      # The cluster does not follow "stable": argocd/apps/gameserver-ui/values.yaml
      # pins the digest. Renovate notices that "stable" moved and opens the PR
      # that rolls this build out.
      - name: Summarise the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Pushed ghcr.io/jaydee94/gameserver-ui"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo
            echo "Not deployed yet. Renovate opens a PR that sets this digest in"
            echo "\`argocd/apps/gameserver-ui/values.yaml\`; merging that PR rolls it out."
          } >> "$GITHUB_STEP_SUMMARY"
