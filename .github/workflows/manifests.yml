---
name: Manifests

# Schema validation of what ArgoCD would apply. `helm lint` only checks the
# charts themselves; a typo in a rendered manifest (or in a CRD resource such
# as a ClusterIssuer or a VM* object) otherwise shows up first as an ArgoCD
# sync error on the live cluster.
#
# Every app under argocd/apps is rendered the way ArgoCD does it (helm
# template, kustomize, or raw YAML) and validated with kubeconform in strict
# mode. Built-in kinds use the Kubernetes JSON schemas, custom resources the
# datreeio/CRDs-catalog; kinds that have no schema are skipped, not failed.
#
# Deliberately NOT a required status check in the branch protection of main.
"on":
  pull_request:
    paths:
      - "argocd/**"
      - ".github/scripts/validate_manifests.sh"
      - ".github/workflows/manifests.yml"
  push:
    branches: [main]
    paths:
      - "argocd/**"
      - ".github/scripts/validate_manifests.sh"
      - ".github/workflows/manifests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: manifests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Newest Kubernetes version that kubeconform has schemas for
  # (yannh/kubernetes-json-schema has v1.37.2-standalone-strict) and, not by
  # accident, the k3s version the cluster runs (ansible/group_vars/all.yml).
  # kubectl is pinned to the same version. When k3s moves on, bump all three
  # together (KUBERNETES_VERSION, KUBECTL_VERSION, KUBECTL_SHA256).
  KUBERNETES_VERSION: "1.37.2"
  KUBECTL_VERSION: "v1.37.2"
  # https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl.sha256
  KUBECTL_SHA256: "c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4"
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: "v0.8.0"
  # kubeconform-linux-amd64.tar.gz in the CHECKSUMS file of that release. A
  # Renovate bump of KUBECONFORM_VERSION fails the job until this is updated
  # with it, on purpose: the checksum must be checked by a human, not taken
  # from the release that is being installed.
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  # Same Helm 3 line that the k3s role installs on the host.
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "v3.22.1"

jobs:
  kubeconform:
    name: kubeconform (all apps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      # Chart repository indexes and downloaded chart archives. The key follows
      # the dependency declarations: a version bump in a Chart.yaml misses the
      # cache and refreshes it; the restore key keeps the unchanged charts.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/helm
          key: helm-deps-${{ runner.os }}-${{ env.HELM_VERSION }}-${{ hashFiles('argocd/apps/*/Chart.yaml') }}
          restore-keys: |
            helm-deps-${{ runner.os }}-${{ env.HELM_VERSION }}-
      - name: Install kubectl and kubeconform (pinned, checksum verified)
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/bin"
          mkdir -p "${bin}" "${RUNNER_TEMP}/dl"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/dl/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  ${RUNNER_TEMP}/dl/kubectl" | sha256sum --check --strict
          install -m 0755 "${RUNNER_TEMP}/dl/kubectl" "${bin}/kubectl"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/dl/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${RUNNER_TEMP}/dl/kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/dl/kubeconform.tar.gz" -C "${bin}" kubeconform
          echo "${bin}" >> "${GITHUB_PATH}"
      - name: Validate all apps
        run: |
          kubeconform -v
          helm version --short
          kubectl version --client
          .github/scripts/validate_manifests.sh
