[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = ~/.ansible/collections
host_key_checking = False
retry_files_enabled = False
# The community.general "yaml" callback was removed in community.general 12;
# the built-in default callback prints YAML when result_format is set.
stdout_callback = default
callback_result_format = yaml
bin_ansible_callbacks = True
forks = 10
gathering = smart
fact_caching = jsonfile
# Per-user cache instead of a world-writable, predictable path in /tmp.
fact_caching_connection = ~/.cache/ansible-facts
fact_caching_timeout = 3600
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
