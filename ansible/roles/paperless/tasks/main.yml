---

# Tasks to prepare directories, render templates and deploy paperless-ngx

- name: Assert required paperless secrets are set
  ansible.builtin.assert:
    that:
      - paperless_db_password | length > 0
      - paperless_secret_key | length > 0
      - paperless_admin_password | default('') | length > 0
    fail_msg: >-
      paperless_db_password, paperless_secret_key and paperless_admin_password
      must be set via vault. Without paperless_admin_password, the initial
      superuser silently falls back to admin/admin.
      See ansible/host_vars/ugreen-nas/vault.yml.example for instructions.

# Docker is NOT installed by default: the UGREEN NAS already runs Docker
# (data-root on /volume1/@docker). The role only verifies that the Compose v2
# plugin is usable and fails early with a clear message otherwise. Set
# paperless_install_docker: true only for a plain Debian/Ubuntu host without
# Docker — see tasks/install_docker.yml.
- name: Install Docker Engine (opt-in, plain Debian/Ubuntu hosts only)
  ansible.builtin.include_tasks: install_docker.yml
  when: paperless_install_docker | bool

- name: Pre-flight — check that Docker Compose v2 is available
  ansible.builtin.command: docker compose version
  register: paperless_compose_preflight
  changed_when: false
  failed_when: false
  check_mode: false

- name: Pre-flight — fail early when Docker Compose is missing
  ansible.builtin.assert:
    that:
      - paperless_compose_preflight.rc == 0
    fail_msg: >-
      `docker compose version` failed on {{ inventory_hostname }}:
      {{ paperless_compose_preflight.msg | default(paperless_compose_preflight.stderr | default('')) }}
      Install/enable Docker on the host or set paperless_install_docker: true
      on a plain Debian/Ubuntu host.
    quiet: true

- name: Ensure group exists
  ansible.builtin.group:
    name: "{{ paperless_group }}"
    gid: "{{ paperless_gid }}"
    state: present

- name: Ensure user exists
  ansible.builtin.user:
    name: "{{ paperless_user }}"
    uid: "{{ paperless_uid }}"
    group: "{{ paperless_group }}"
    createhome: false
    shell: /usr/sbin/nologin
    state: present

- name: Create paperless backup and export directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ paperless_user }}"
    group: "{{ paperless_group }}"
    mode: '0755'
  loop:
    - "{{ paperless_backup_dir }}"
    - "{{ paperless_export_dir }}"

- name: Template backup script
  ansible.builtin.template:
    src: backup-paperless.sh.j2
    dest: "{{ paperless_base_dir }}/backup-paperless.sh"
    owner: "{{ paperless_user }}"
    group: "{{ paperless_group }}"
    mode: '0755'

- name: Configure daily backup cron job
  ansible.builtin.cron:
    name: "Paperless Daily Backup"
    minute: "{{ paperless_backup_schedule.split(' ')[0] }}"
    hour: "{{ paperless_backup_schedule.split(' ')[1] }}"
    day: "{{ paperless_backup_schedule.split(' ')[2] }}"
    month: "{{ paperless_backup_schedule.split(' ')[3] }}"
    weekday: "{{ paperless_backup_schedule.split(' ')[4] }}"
    user: root
    job: "{{ paperless_base_dir }}/backup-paperless.sh >> {{ paperless_backup_dir }}/backup.log 2>&1"

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ paperless_user }}"
    groups: docker
    append: true

- name: Create base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ paperless_user }}"
    group: "{{ paperless_group }}"
    mode: '0755'
  loop:
    - "{{ paperless_base_dir }}"
    - "{{ paperless_media_dir }}"
    - "{{ paperless_data_dir }}"
    - "{{ paperless_consume_dir }}"

- name: Create database directory
  ansible.builtin.file:
    path: "{{ paperless_db_dir }}"
    state: directory
    owner: "{{ paperless_db_uid }}"
    group: "{{ paperless_db_gid }}"
    mode: '0700'

- name: Deploy .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ paperless_base_dir }}/.env"
    owner: "{{ paperless_user }}"
    group: "{{ paperless_group }}"
    mode: '0640'
  # Contains DB password, admin password and secret key: never print the
  # rendered file (`make nas-check` runs with --diff) or the task result.
  no_log: true
  diff: false
  notify: Restart paperless compose

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ paperless_base_dir }}/{{ paperless_compose_file }}"
    owner: "{{ paperless_user }}"
    group: "{{ paperless_group }}"
    mode: '0640'
  # The template no longer holds secrets, but the copy currently deployed on
  # the NAS still has POSTGRES_PASSWORD in plain text — a diff would print it
  # as the "before" side.
  diff: false
  notify: Restart paperless compose

- name: Deploy paperless docker-compose stack
  community.docker.docker_compose_v2:
    project_src: "{{ paperless_base_dir }}"
    files:
      - "{{ paperless_compose_file }}"
    state: present
    pull: missing
