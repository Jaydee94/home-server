---
# Default variables for paperless role
# These can be overridden in group_vars/host_vars or playbooks

paperless_user: paperless
paperless_group: paperless
paperless_uid: 1100
paperless_gid: 1100

# Base directory where paperless files, db and media will live
paperless_base_dir: /opt/paperless
paperless_media_dir: "{{ paperless_base_dir }}/media"
paperless_data_dir: "{{ paperless_base_dir }}/data"
paperless_db_dir: "{{ paperless_base_dir }}/db"

# Backup settings
paperless_backup_dir: "{{ paperless_base_dir }}/backups"
paperless_consume_dir: "{{ paperless_base_dir }}/consume"
paperless_export_dir: "{{ paperless_base_dir }}/export"
paperless_backup_retention_days: 7
paperless_backup_schedule: "0 2 * * *"
# Log and status file deliberately live in the base dir, not in the backup dir:
# they must stay writable/readable when the backup target is not mounted.
paperless_backup_log_file: "{{ paperless_base_dir }}/backup.log"
paperless_backup_status_file: "{{ paperless_base_dir }}/backup-last-success"

# Extra arguments for `document_exporter ../export`.
#   --delete           remove files from the EXPORT directory that no longer
#                      belong to the current export (deleted/renamed documents).
#                      Only touches the export dir, never media/ or archives.
#   --no-progress-bar  quiet output for cron.
paperless_backup_exporter_args:
  - --delete
  - --no-progress-bar

# Plausibility checks before an archive is created. A run that fails them
# leaves the existing archives untouched (no retention) and reports an error.
# Minimum number of files in the export (3 per document + manifest); set to 2
# on a brand-new instance without documents.
paperless_backup_min_files: 10
paperless_backup_min_manifest_bytes: 1024
# Fail if the export is more than this many percent smaller than at the last
# good run (0 disables). Override once with `FORCE=1 backup-paperless.sh`.
paperless_backup_max_shrink_percent: 50

# If set, the path must be a mount point, otherwise the backup aborts instead
# of writing onto the system partition (e.g. /volume1 on the NAS).
paperless_backup_required_mount: ""

# Optional second target directory (USB disk, other volume). The finished
# archive is copied there as well. Must already exist and be on a different
# filesystem than paperless_backup_dir and paperless_base_dir. Empty = off.
paperless_backup_secondary_dir: ""
paperless_backup_secondary_retention_days: "{{ paperless_backup_retention_days }}"

# Optional ntfy-compatible push URL (https://ntfy.example/topic). The script
# sends `curl -H "Title: …" -d "text" <url>` on failure, and on success only
# if paperless_backup_notify_on_success is true. Empty = log only.
paperless_backup_notify_url: ""
paperless_backup_notify_on_success: false

# Optional node-exporter textfile collector directory. If set and present,
# the script writes paperless_backup.prom there
# (paperless_backup_last_success_timestamp_seconds, …). Empty = no metrics.
paperless_backup_textfile_dir: ""

# Ports exposed on the host
paperless_http_port: 8000

# Images and tags (tracked by Renovate via the generic regex customManager)
# renovate: datasource=docker depName=ghcr.io/paperless-ngx/paperless-ngx
paperless_image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2
# renovate: datasource=docker depName=postgres
paperless_db_image: postgres:16-alpine
# renovate: datasource=docker depName=redis
paperless_redis_image: redis:8-alpine
# renovate: datasource=docker depName=clusterzx/paperless-ai
paperless_ai_image: clusterzx/paperless-ai:4.0.0

# Paperless-AI settings
paperless_ai_port: 3000
paperless_ai_enabled: false

# Postgres settings (used inside docker-compose/.env)
paperless_db_user: paperless
paperless_db_password: ""
paperless_secret_key: ""
paperless_db_name: paperless

# Postgres UID/GID (70:70 is standard for postgres:alpine images)
paperless_db_uid: 70
paperless_db_gid: 70

# Compose file name
paperless_compose_file: docker-compose.yml
