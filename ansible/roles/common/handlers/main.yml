---
- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted

# Ubuntu names the unit "ssh". A reload keeps established sessions (including
# the one Ansible is using) alive.
- name: Reload sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded
