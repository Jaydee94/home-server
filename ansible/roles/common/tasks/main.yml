---
# ============================================================
# common/tasks/main.yml — Base OS configuration
# ============================================================

# ---- Hostname -----------------------------------------------
- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"
    use: systemd

- name: Update /etc/hosts with hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ hostname }}"
    state: present

# ---- Package Management ------------------------------------
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages to latest (dist-upgrade)
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
  when: auto_upgrade | bool

- name: Install required system packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
      - python3-kubernetes
      - nfs-common
      - open-iscsi
      - chrony
      - jq
      - unzip
      - net-tools
      - htop
      - vim
      - bash-completion
      - ufw
      - unattended-upgrades
      - update-notifier-common   # provides /var/run/reboot-required
      - intel-media-va-driver-non-free  # VAAPI/Quick Sync driver for Intel iGPUs (Jellyfin hw transcoding)
      - vainfo                          # VAAPI diagnostics
      - ethtool                         # NIC ring-buffer / offload tuning (e1000e hang fix)
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"

# ---- Intel Quick Sync (VAAPI) diagnostics --------------------
# Non-blocking: hosts without an Intel iGPU simply show no VAAPI profiles.
# Used to confirm hardware transcoding is usable for Jellyfin — see
# docs/16-jellyfin.md and argocd/apps/jellyfin/values.yaml.
- name: Query VAAPI capabilities (Intel Quick Sync diagnostics)
  # --display drm: headless server, no X11/Wayland session to connect to.
  ansible.builtin.command: vainfo --display drm
  register: common_vainfo
  changed_when: false
  failed_when: false

- name: Display VAAPI capabilities
  ansible.builtin.debug:
    var: common_vainfo.stdout_lines

- name: Look up the host's "render" group GID (needed for Jellyfin's podSecurityContext.supplementalGroups)
  ansible.builtin.command: getent group render
  register: common_render_group
  changed_when: false
  failed_when: false

- name: Display render group GID
  ansible.builtin.debug:
    msg: >-
      {{ 'render group GID: ' + common_render_group.stdout.split(':')[2]
         if common_render_group.rc == 0
         else 'No "render" group found on this host.' }}

# ---- Unattended upgrades (background security patches) -----
- name: Enable unattended-upgrades (security patches between Ansible runs)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      // Managed by Ansible — controls unattended-upgrades cadence.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";

# The reboot at the end of this role is skipped whenever the playbook runs from
# Semaphore (see "Reboot if package upgrades require it" below) — which is every
# scheduled run. Without Automatic-Reboot a pending kernel/libc update would
# therefore never become active. Toggle/time: unattended_reboot_* in group_vars.
- name: Configure unattended-upgrades to also pull "updates" and clean up
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-home-server
    owner: root
    group: root
    mode: '0644'
    content: |
      // Managed by Ansible.
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-apps-security";
          "${distro_id}ESM:${distro_codename}-infra-security";
          "${distro_id}:${distro_codename}-updates";
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      // Reboot on its own when a package (kernel, libc, ...) left
      // /var/run/reboot-required behind. unattended-upgrade schedules it with
      // `shutdown -r <time>`, so it happens at the next occurrence of that time.
      Unattended-Upgrade::Automatic-Reboot "{{ unattended_reboot_enabled | bool | lower }}";
      Unattended-Upgrade::Automatic-Reboot-Time "{{ unattended_reboot_time }}";

- name: Ensure unattended-upgrades service is enabled
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: true
    state: started

# ---- Timezone -----------------------------------------------
- name: Set system timezone
  community.general.timezone:
    name: "{{ timezone }}"
  notify: Restart chrony

# ---- Chrony (NTP) -------------------------------------------
- name: Ensure chrony is enabled and running
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

# ---- Swap ---------------------------------------------------
- name: Check for active swap devices
  ansible.builtin.command: swapon --noheadings --show=NAME
  register: common_active_swap
  changed_when: false

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  when: common_active_swap.stdout | trim | length > 0
  changed_when: true

- name: Remove swap entries from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'

- name: Ensure swap is not re-enabled by systemd
  ansible.builtin.systemd:
    name: swap.target
    enabled: false
    state: stopped
    masked: true

# ---- Kernel Modules -----------------------------------------
- name: Create modules-load.d config for k3s/Kubernetes
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      br_netfilter
      overlay
    mode: '0644'

- name: Load required kernel modules for k3s/Kubernetes
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - br_netfilter
    - overlay

# ---- sysctl -------------------------------------------------
- name: Configure sysctl parameters for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-k3s.conf
    reload: true
    state: present
  loop:
    - {key: "net.ipv4.ip_forward", value: "1"}
    - {key: "net.bridge.bridge-nf-call-iptables", value: "1"}
    - {key: "net.bridge.bridge-nf-call-ip6tables", value: "1"}
    - {key: "net.ipv6.conf.all.forwarding", value: "1"}
    - {key: "fs.inotify.max_user_watches", value: "524288"}
    - {key: "fs.inotify.max_user_instances", value: "512"}
    - {key: "vm.swappiness", value: "0"}
  notify: Reload sysctl

# ---- AppArmor: keep container signals working ----------------
# Ubuntu 26.04 ships kernel.apparmor_restrict_unprivileged_unconfined=1
# (/usr/lib/sysctl.d/10-apparmor.conf). With it, the profile change runc does
# when it starts a container process is "converted to stacking": the process
# ends up labelled "cri-containerd.apparmor.d//&unconfined" instead of
# "cri-containerd.apparmor.d". containerd's default profile only allows
# signals to the unstacked label, so EVERY signal between processes/threads
# of the same container is denied (dmesg: apparmor="DENIED" operation="signal"
# peer="cri-containerd.apparmor.d//&unconfined").
#
# Effects seen here: .NET apps (Sonarr/Radarr) abort silently in a loop,
# vmagent/vmalert cannot SIGHUP themselves, QEMU cannot kick its vCPU threads,
# Postgres loses its SIGURG wake-ups (~25k denials a day).
#
# Verified on this host with throwaway pods: with the sysctl at 0 a new pod is
# labelled "cri-containerd.apparmor.d" and kill(2) inside the container works;
# back at 1 it is stacked again and kill fails with EPERM. Containers stay
# confined by the containerd profile either way — this only stops the
# stacking. Only affects processes started afterwards: reboot (or restart all
# pods) once after the first rollout. See docs/gotchas.md → AppArmor.
- name: Allow containerd's AppArmor profile transition without stacking
  ansible.posix.sysctl:
    name: kernel.apparmor_restrict_unprivileged_unconfined
    value: "0"
    sysctl_file: /etc/sysctl.d/99-apparmor-containers.conf
    reload: true
    state: present
  notify: Reload sysctl

# ---- journald size limit ------------------------------------
# Without a cap the journal grows to 10 % of the filesystem (4 GB max) and is
# only trimmed by the weekly homeserver-cleanup timer.
- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Limit journald disk usage and retention
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible (common role).
      [Journal]
      SystemMaxUse={{ journald_system_max_use }}
      MaxRetentionSec={{ journald_max_retention }}
  notify: Restart systemd-journald

# ---- SSH hardening ------------------------------------------
# Key-only logins, no root login, no X11. The drop-in is named 10-* on purpose:
# sshd uses the FIRST value it reads for a keyword and the Ubuntu installer
# leaves /etc/ssh/sshd_config.d/50-cloud-init.conf with
# "PasswordAuthentication yes" behind, which would win over anything sorted
# after it.
#
# Lock-out guard: password logins are only switched off when the user Ansible
# connects as has at least one key in ~/.ssh/authorized_keys. Otherwise the
# whole SSH part is skipped with a warning instead of failing the run.
- name: Read authorized_keys of the connecting user (SSH lock-out guard)
  ansible.builtin.slurp:
    src: "~/.ssh/authorized_keys"
  become: false
  register: common_ssh_authorized_keys
  failed_when: false
  when: ssh_hardening_enabled | bool

- name: Count the keys the connecting user can log in with
  ansible.builtin.set_fact:
    common_ssh_key_count: >-
      {{
        (common_ssh_authorized_keys.content | default('') | b64decode).splitlines()
        | map('trim') | reject('match', '^(#.*)?$') | list | length
      }}
  when: ssh_hardening_enabled | bool

- name: Harden sshd (key-only, no root login, no X11 forwarding)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: '0600'
    content: |
      # Managed by Ansible (common role). Must sort before 50-cloud-init.conf:
      # sshd keeps the first value it reads for each keyword.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
  when:
    - ssh_hardening_enabled | bool
    - common_ssh_key_count | int > 0

- name: SSH hardening skipped — the connecting user has no authorized key
  ansible.builtin.debug:
    msg: >
      WARNING: no key found in ~/.ssh/authorized_keys of the user Ansible
      connects as. Disabling password logins now could lock you out, so
      /etc/ssh/sshd_config.d/10-hardening.conf was NOT written. Add a public
      key for that user and re-run.
  when:
    - ssh_hardening_enabled | bool
    - common_ssh_key_count | int == 0

# Apply the sshd/journald changes right away instead of at the end of the play:
# a later role failing would otherwise leave them written but not active.
- name: Apply pending sshd / journald changes now
  ansible.builtin.meta: flush_handlers

- name: Read the effective sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -T
  register: common_sshd_effective
  changed_when: false
  failed_when: false
  check_mode: false
  when: ssh_hardening_enabled | bool

- name: Warn if password logins are still enabled
  ansible.builtin.debug:
    msg: >
      WARNING: sshd still reports "passwordauthentication yes". Another file
      in /etc/ssh/sshd_config.d/ that sorts before 10-hardening.conf (or a
      Match block) overrides the hardening drop-in.
  when:
    - ssh_hardening_enabled | bool
    - common_ssh_key_count | int > 0
    - "'passwordauthentication yes' in (common_sshd_effective.stdout | default('') | lower)"

# ---- NIC Tuning (e1000e TX-Ring / TSO-Fix) ------------------
# The Intel e1000e NIC (eno1) triggers "Hardware Unit Hang" kernel panics under
# high pod-network load when the TX ring is at its default size of 256.
# Maximising the ring (4096) and disabling TSO/GSO prevents descriptor stalls.
# A oneshot service re-applies settings after every reboot.
- name: Deploy NIC tuning systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nic-tuning.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=NIC ring-buffer and offload tuning for {{ network_interface }} (e1000e hang fix)
      After=network.target
      Wants=network.target

      [Service]
      Type=oneshot
      RemainAfterExit=true
      ExecStart=/usr/sbin/ethtool -G {{ network_interface }} tx {{ nic_tx_ring_size }} rx {{ nic_rx_ring_size }}
      ExecStart=/usr/sbin/ethtool -K {{ network_interface }} tso off gso off

      [Install]
      WantedBy=multi-user.target

- name: Enable and start NIC tuning service
  ansible.builtin.systemd:
    name: nic-tuning.service
    enabled: true
    state: started
    daemon_reload: true

# ---- UFW Firewall -------------------------------------------
# NOTE: we never call `state: reset` — that would wipe SSH access mid-playbook.
#
# Nothing on this host is meant to be reachable from outside the LAN / Tailnet
# (see CLAUDE.md → Networking), so host services are opened per source network
# instead of for "Anywhere". The k3s API (6443), kubelet (10250), Flannel VXLAN
# (8472/udp) and the ArgoCD NodePorts (30080/30443) need no rule of their own:
# every legitimate client comes from one of the networks that are allowed
# wholesale below (LAN, Tailnet, pod CIDR, service CIDR).
#
# Allow SSH FIRST so enabling UFW later cannot lock us out. The pod CIDR is
# listed because Semaphore runs as a pod on this host and reaches sshd with its
# pod IP as source address.
- name: Allow SSH (port 22) from LAN, Tailnet and pods before any other firewall changes
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ item.src }}"
    comment: "{{ item.comment }}"
  loop:
    - {src: "{{ local_subnet }}", comment: "SSH from LAN"}
    - {src: "{{ tailscale_cidr }}", comment: "SSH from Tailnet"}
    - {src: "{{ k3s_pod_cidr }}", comment: "SSH from pods (Semaphore)"}
  loop_control:
    label: "{{ item.comment }}"

- name: Set UFW default incoming policy to deny
  community.general.ufw:
    default: deny
    direction: incoming

- name: Set UFW default outgoing policy to allow
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Allow HTTP (port 80) for Traefik ingress
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    comment: "HTTP Traefik ingress"

- name: Allow HTTPS (port 443)
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp
    comment: "HTTPS Traefik ingress"

- name: Allow Tailscale WireGuard (UDP 41641)
  community.general.ufw:
    rule: allow
    port: "41641"
    proto: udp
    comment: "Tailscale WireGuard VPN"

- name: Allow all traffic from k3s pod CIDR
  community.general.ufw:
    rule: allow
    src: "{{ k3s_pod_cidr }}"
    comment: "k3s pod CIDR traffic"

- name: Allow all traffic from k3s service CIDR
  community.general.ufw:
    rule: allow
    src: "{{ k3s_service_cidr }}"
    comment: "k3s service CIDR traffic"

- name: Allow all traffic from local LAN subnet
  community.general.ufw:
    rule: allow
    src: "{{ local_subnet }}"
    comment: "Local LAN subnet access"

- name: Allow all traffic from Tailscale network
  community.general.ufw:
    rule: allow
    src: "{{ tailscale_cidr }}"
    comment: "Tailscale VPN network"

# Earlier versions of this role opened these ports for "Anywhere" (IPv4 and
# IPv6). Delete those rules from hosts that still carry them — only now that the
# source-based rules above exist, so SSH is never without an allow rule. A
# no-op once the rules are gone.
- name: Remove the former world-open rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    delete: true
  loop:
    - {port: "22", proto: tcp}      # SSH
    - {port: "6443", proto: tcp}    # k3s API
    - {port: "10250", proto: tcp}   # kubelet API
    - {port: "8472", proto: udp}    # Flannel VXLAN
    - {port: "30080", proto: tcp}   # ArgoCD NodePort HTTP
    - {port: "30443", proto: tcp}   # ArgoCD NodePort HTTPS
  loop_control:
    label: "{{ item.port }}/{{ item.proto }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Verify UFW is active
  ansible.builtin.command: ufw status verbose
  register: common_ufw_status
  changed_when: false

- name: Display UFW status
  ansible.builtin.debug:
    var: common_ufw_status.stdout_lines

# ---- Static IP via Netplan ----------------------------------
# Configures /etc/netplan/99-static.yaml and applies it. The SSH session will
# move to the new IP, so make sure `ansible_host` matches `network_static_ip`
# (or update the inventory after the first run).
- name: Configure static IP via Netplan
  when: network_configure_static_ip | bool
  block:
    - name: Find existing Netplan configs
      ansible.builtin.find:
        paths: /etc/netplan
        patterns:
          - "*.yaml"
          - "*.yml"
        excludes:
          - "99-static.yaml"
      register: common_netplan_existing

    - name: Remove existing Netplan DHCP configs
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ common_netplan_existing.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Deploy static Netplan configuration
      ansible.builtin.template:
        src: netplan-static.yaml.j2
        dest: /etc/netplan/99-static.yaml
        owner: root
        group: root
        mode: '0600'

    - name: Apply Netplan configuration (connection will briefly drop)
      ansible.builtin.command: netplan apply
      async: 10
      poll: 0
      changed_when: true

    - name: Wait for server to be reachable at the new static IP
      ansible.builtin.wait_for:
        host: "{{ network_static_ip }}"
        port: 22
        delay: 5
        timeout: 60
      delegate_to: localhost
      become: false

# ---- Reboot if package upgrades require it -----------------
- name: Check whether a reboot is required (kernel/libc updates)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: common_reboot_required

- name: Reboot the server because /var/run/reboot-required is set
  ansible.builtin.reboot:
    msg: "Reboot triggered by Ansible: kernel/libc update applied"
    connect_timeout: 5
    reboot_timeout: 600
    pre_reboot_delay: 5
    post_reboot_delay: 30
    test_command: uptime
  when:
    - common_reboot_required.stat.exists
    - auto_reboot_if_required | bool
    - lookup('env', 'SEMAPHORE_TASK_ID') | length == 0

- name: Reboot required but auto_reboot_if_required is false — warn the operator
  ansible.builtin.debug:
    msg: >
      A reboot is required (/var/run/reboot-required exists) but
      `auto_reboot_if_required` is false. Reboot the server manually with
      `sudo reboot` to finalize kernel/libc updates.
  when:
    - common_reboot_required.stat.exists
    - not (auto_reboot_if_required | bool)
    - lookup('env', 'SEMAPHORE_TASK_ID') | length == 0

# Semaphore runs as a Pod on this very host — rebooting kills the Pod that's
# executing the playbook, so the task hangs forever. Skip the reboot here;
# unattended-upgrades does it at `unattended_reboot_time` (Automatic-Reboot).
- name: Reboot required but Semaphore is running this task — warn instead of self-killing
  ansible.builtin.debug:
    msg: >
      A reboot is required (/var/run/reboot-required exists) but this playbook
      is running inside Semaphore (SEMAPHORE_TASK_ID is set). Auto-reboot is
      skipped to avoid killing the executor Pod.
      {{ 'unattended-upgrades will reboot the host at ' ~ unattended_reboot_time ~ ' instead.'
         if unattended_reboot_enabled | bool
         else 'Reboot manually after the run finishes: `ssh jaydee@homeserver "sudo reboot"`.' }}
  when:
    - common_reboot_required.stat.exists
    - lookup('env', 'SEMAPHORE_TASK_ID') | length > 0

# ── Weekly cleanup timer ────────────────────────────────────────────────────
- name: Deploy homeserver-cleanup script
  ansible.builtin.template:
    src: homeserver-cleanup.sh.j2
    dest: /usr/local/bin/homeserver-cleanup.sh
    owner: root
    group: root
    mode: "0755"

- name: Create homeserver-cleanup systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/homeserver-cleanup.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly home-server maintenance (image prune, journal vacuum, apt clean)
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/homeserver-cleanup.sh
      StandardOutput=journal
      StandardError=journal

- name: Create homeserver-cleanup systemd timer (weekly, Sunday 03:00)
  ansible.builtin.copy:
    dest: /etc/systemd/system/homeserver-cleanup.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Weekly home-server maintenance timer

      [Timer]
      OnCalendar=Sun *-*-* 03:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Enable and start homeserver-cleanup timer
  ansible.builtin.systemd:
    name: homeserver-cleanup.timer
    enabled: true
    state: started
    daemon_reload: true
