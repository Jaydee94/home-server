---
# ============================================================
# Provision one cron schedule for a template inside the current
# project. Idempotent: GET list → POST if a schedule with that
# name doesn't exist yet, else PUT the full desired body so the
# cron expression is self-healing on re-runs.
#
# Schedules are evaluated in SEMAPHORE_SCHEDULE_TIMEZONE (set to
# Europe/Berlin in the Semaphore Deployment), so "0 6 * * *" fires
# at 06:00 local time year-round.
# ============================================================

- name: List existing schedules in project {{ project_spec.name }}
  ansible.builtin.uri:
    url: "{{ semaphore_bootstrap_api_base }}/api/project/{{ semaphore_bootstrap_project_id }}/schedules"
    method: GET
    headers:
      Cookie: "{{ semaphore_bootstrap_cookie }}"
    return_content: true
  register: semaphore_bootstrap_sched_existing

- name: Decide if schedule exists - {{ schedule_spec.name }}
  ansible.builtin.set_fact:
    semaphore_bootstrap_schedule_exists: >-
      {{ (semaphore_bootstrap_sched_existing.json
          | selectattr('name', 'equalto', schedule_spec.name)
          | list | length) > 0 }}

- name: Find existing schedule id for '{{ schedule_spec.name }}'
  ansible.builtin.set_fact:
    semaphore_bootstrap_schedule_id: >-
      {{ (semaphore_bootstrap_sched_existing.json
           | selectattr('name', 'equalto', schedule_spec.name)
           | list | first | default({})).id | default(none) }}
  when: semaphore_bootstrap_schedule_exists

- name: Assert that schedule template exists - {{ schedule_spec.name }}
  ansible.builtin.assert:
    that: "schedule_spec.template in semaphore_bootstrap_project_template_map"
    fail_msg: >-
      Schedule '{{ schedule_spec.name }}' references unknown template
      '{{ schedule_spec.template }}' in project '{{ project_spec.name }}'.
      Available templates: {{ semaphore_bootstrap_project_template_map.keys() | list }}.

# Jinja dict literal so semaphore_bootstrap_project_id/semaphore_bootstrap_template_id stay JSON integers —
# Semaphore's Go decoder rejects stringified ints (see template.yml).
- name: Create schedule '{{ schedule_spec.name }}'
  ansible.builtin.uri:
    url: "{{ semaphore_bootstrap_api_base }}/api/project/{{ semaphore_bootstrap_project_id }}/schedules"
    method: POST
    body_format: json
    body: >-
      {{
        {
          'semaphore_bootstrap_project_id': semaphore_bootstrap_project_id | int,
          'semaphore_bootstrap_template_id': semaphore_bootstrap_project_template_map[schedule_spec.template] | int,
          'name': schedule_spec.name,
          'cron_format': schedule_spec.cron,
          'active': schedule_spec.active | default(true),
        }
      }}
    headers:
      Cookie: "{{ semaphore_bootstrap_cookie }}"
    status_code: [200, 201, 204]
  when: not semaphore_bootstrap_schedule_exists

- name: Update schedule '{{ schedule_spec.name }}'
  ansible.builtin.uri:
    url: "{{ semaphore_bootstrap_api_base }}/api/project/{{ semaphore_bootstrap_project_id }}/schedules/{{ semaphore_bootstrap_schedule_id | int }}"
    method: PUT
    body_format: json
    body: >-
      {{
        {
          'id': semaphore_bootstrap_schedule_id | int,
          'semaphore_bootstrap_project_id': semaphore_bootstrap_project_id | int,
          'semaphore_bootstrap_template_id': semaphore_bootstrap_project_template_map[schedule_spec.template] | int,
          'name': schedule_spec.name,
          'cron_format': schedule_spec.cron,
          'active': schedule_spec.active | default(true),
        }
      }}
    headers:
      Cookie: "{{ semaphore_bootstrap_cookie }}"
    status_code: [200, 204]
  when: semaphore_bootstrap_schedule_exists
  changed_when: false
