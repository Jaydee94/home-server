---
# ============================================================
# Provision one inventory entry inside the current project.
# `ssh_key` field references a key by name from semaphore_bootstrap_default_keys.
# Body is built as a single Jinja dict so Python-native types survive
# into the JSON encoder — same pattern as template.yml. YAML scalars
# with `"{{ expr | int }}"` wrappers can be stringified before they
# reach the encoder, causing Semaphore's strict int unmarshaler to
# return 400 for required integer fields like ssh_key_id.
# ============================================================

- name: List existing inventories in project {{ project_spec.name }}
  ansible.builtin.uri:
    url: "{{ semaphore_bootstrap_api_base }}/api/project/{{ semaphore_bootstrap_project_id }}/inventory"
    method: GET
    headers:
      Cookie: "{{ semaphore_bootstrap_cookie }}"
    return_content: true
  register: semaphore_bootstrap_inv_existing

- name: Decide if inventory exists for {{ inventory_spec.name }}
  ansible.builtin.set_fact:
    semaphore_bootstrap_inventory_exists: >-
      {{ (semaphore_bootstrap_inv_existing.json
          | selectattr('name', 'equalto', inventory_spec.name)
          | list | length) > 0 }}

- name: Find existing inventory id for {{ inventory_spec.name }}
  ansible.builtin.set_fact:
    semaphore_bootstrap_inventory_id: >-
      {{ (semaphore_bootstrap_inv_existing.json
           | selectattr('name', 'equalto', inventory_spec.name)
           | list | first | default({})).id | default(none) }}
  when: semaphore_bootstrap_inventory_exists

- name: Create inventory {{ inventory_spec.name }}
  ansible.builtin.uri:
    url: "{{ semaphore_bootstrap_api_base }}/api/project/{{ semaphore_bootstrap_project_id }}/inventory"
    method: POST
    body_format: json
    body: >-
      {{
        {
          'name': inventory_spec.name,
          'semaphore_bootstrap_project_id': semaphore_bootstrap_project_id | int,
          'inventory': inventory_spec.content,
          'ssh_key_id': semaphore_bootstrap_project_key_map[inventory_spec.ssh_key] | int,
          'become_key_id': none,
          'semaphore_bootstrap_repository_id': none,
          'type': inventory_spec.type | default('static'),
        }
      }}
    headers:
      Cookie: "{{ semaphore_bootstrap_cookie }}"
    status_code: [200, 201, 204]
  when: not semaphore_bootstrap_inventory_exists

# Existing inventories may pre-date a content change in defaults/main.yml.
# PUT the full desired body so re-running the bootstrap is self-healing —
# same pattern as template.yml.
- name: Update inventory {{ inventory_spec.name }}
  ansible.builtin.uri:
    url: "{{ semaphore_bootstrap_api_base }}/api/project/{{ semaphore_bootstrap_project_id }}/inventory/{{ semaphore_bootstrap_inventory_id | int }}"
    method: PUT
    body_format: json
    body: >-
      {{
        {
          'id': semaphore_bootstrap_inventory_id | int,
          'name': inventory_spec.name,
          'semaphore_bootstrap_project_id': semaphore_bootstrap_project_id | int,
          'inventory': inventory_spec.content,
          'ssh_key_id': semaphore_bootstrap_project_key_map[inventory_spec.ssh_key] | int,
          'become_key_id': none,
          'semaphore_bootstrap_repository_id': none,
          'type': inventory_spec.type | default('static'),
        }
      }}
    headers:
      Cookie: "{{ semaphore_bootstrap_cookie }}"
    status_code: [200, 204, 400, 422, 500]
    return_content: true
  register: semaphore_bootstrap_inv_update_result
  when: semaphore_bootstrap_inventory_exists
  changed_when: false
  failed_when: false

- name: Fail with HTTP details if inventory update failed
  ansible.builtin.fail:
    msg: >-
      Inventory '{{ inventory_spec.name }}' update failed:
      HTTP {{ semaphore_bootstrap_inv_update_result.status }} — {{ semaphore_bootstrap_inv_update_result.content | default('(empty body)') }}
  when:
    - semaphore_bootstrap_inventory_exists
    - semaphore_bootstrap_inv_update_result is not skipped
    - semaphore_bootstrap_inv_update_result.status not in [200, 204]
