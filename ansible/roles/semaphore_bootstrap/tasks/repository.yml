---
# ============================================================
# Provision the project's Git repository entry. Uses the `git-none`
# access key created earlier (public HTTPS clone, no auth).
# ============================================================

- name: List existing repositories in project {{ project_spec.name }}
  ansible.builtin.uri:
    url: "{{ semaphore_bootstrap_api_base }}/api/project/{{ semaphore_bootstrap_project_id }}/repositories"
    method: GET
    headers:
      Cookie: "{{ semaphore_bootstrap_cookie }}"
    return_content: true
  register: semaphore_bootstrap_repos

- name: Find repository id in project {{ project_spec.name }}
  ansible.builtin.set_fact:
    semaphore_bootstrap_repository_id: >-
      {{ (semaphore_bootstrap_repos.json
           | selectattr('name', 'equalto', project_spec.repository.name)
           | list | first | default({})).id | default(none) }}

- name: Assert git-none key exists in project {{ project_spec.name }}
  ansible.builtin.assert:
    that: "'git-none' in semaphore_bootstrap_project_key_map"
    fail_msg: >-
      Key 'git-none' not found in semaphore_bootstrap_project_key_map for project
      '{{ project_spec.name }}'. Available keys: {{ semaphore_bootstrap_project_key_map.keys() | list }}.
      Ensure 'git-none' is listed in semaphore_bootstrap_default_keys.

- name: Create repository in project {{ project_spec.name }}
  ansible.builtin.uri:
    url: "{{ semaphore_bootstrap_api_base }}/api/project/{{ semaphore_bootstrap_project_id }}/repositories"
    method: POST
    body_format: json
    body: >-
      {{
        {
          'name': project_spec.repository.name,
          'semaphore_bootstrap_project_id': semaphore_bootstrap_project_id | int,
          'git_url': project_spec.repository.url,
          'git_branch': project_spec.repository.branch | default('main'),
          'ssh_key_id': semaphore_bootstrap_project_key_map['git-none'] | int,
        }
      }}
    headers:
      Cookie: "{{ semaphore_bootstrap_cookie }}"
    status_code: [200, 201, 204]
    return_content: true
  register: semaphore_bootstrap_repo_create
  when: semaphore_bootstrap_repository_id in [none, "None", ""]

- name: Capture new repository id for project {{ project_spec.name }}
  ansible.builtin.set_fact:
    semaphore_bootstrap_repository_id: "{{ semaphore_bootstrap_repo_create.json.id }}"
  when:
    - semaphore_bootstrap_repository_id in [none, "None", ""]
    - semaphore_bootstrap_repo_create is not skipped
