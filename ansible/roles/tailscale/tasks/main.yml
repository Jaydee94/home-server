---
# ============================================================
# tailscale/tasks/main.yml — Tailscale VPN installation
# ============================================================

# ---- Add Tailscale Repository -------------------------------
- name: Create directory for APT keyrings
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Download Tailscale GPG signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ tailscale_repo_codename }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
    force: false

- name: Add Tailscale APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/ubuntu {{ tailscale_repo_codename }} main
    filename: tailscale
    state: present
    update_cache: true

# ---- Install Tailscale --------------------------------------
# `state: latest` when auto_upgrade is on so we always run the most recent
# Tailscale client; `state: present` otherwise to honour any local pin.
- name: Install (or upgrade) tailscale package
  ansible.builtin.apt:
    name: tailscale
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"
    update_cache: true

# ---- Enable tailscaled service ------------------------------
- name: Enable and start tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for tailscaled to be ready
  ansible.builtin.wait_for:
    path: /var/run/tailscale/tailscaled.sock
    state: present
    timeout: 30

# ---- Check Existing Connection ------------------------------
- name: Check current Tailscale connection status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_raw
  changed_when: false
  failed_when: false

- name: Parse Tailscale status
  ansible.builtin.set_fact:
    tailscale_connected: >-
      {{
        (tailscale_status_raw.stdout | from_json).BackendState == 'Running'
        if tailscale_status_raw.rc == 0 and tailscale_status_raw.stdout | length > 0
        else false
      }}

- name: Display current Tailscale state
  ansible.builtin.debug:
    msg: "Tailscale connected: {{ tailscale_connected }}"

# ---- Connect to Tailscale -----------------------------------
# Two things this block must guarantee:
#
# 1. The auth key never shows up in the process list. `environment:` does NOT
#    achieve that with become: Ansible wraps the module in
#    `sudo sh -c 'TS_AUTHKEY=tskey-... python3 ...'`, which every local user
#    can read with `ps`. The key is therefore handed over as a 0600 file
#    (`--auth-key=file:...`) that is removed again in `always`.
#
# 2. It never blocks the play. When the node key AND the auth key have expired,
#    `tailscale up` prints a login URL and waits forever for an interactive
#    login. Inside the unattended daily Semaphore run that hung the task for
#    34 hours and blocked every following run (13 Nov 2026). `--timeout` makes
#    tailscale give up; `timeout(1)` is the belt to those braces. A failed
#    login is reported as a warning — Tailscale being logged out must not stop
#    the rest of site.yml from converging.
- name: Connect to Tailscale and advertise the local subnet
  when: not tailscale_connected
  block:
    - name: Write the Tailscale auth key to a root-only file
      ansible.builtin.copy:
        content: "{{ tailscale_auth_key }}"
        dest: /run/tailscale-authkey
        owner: root
        group: root
        mode: "0600"
      no_log: true
      changed_when: false

    - name: Run tailscale up (bounded, never interactive)
      ansible.builtin.command: >
        timeout --kill-after=10 {{ tailscale_up_timeout_seconds | int + 15 }}
        tailscale up
        --auth-key=file:/run/tailscale-authkey
        --timeout={{ tailscale_up_timeout_seconds }}s
        --hostname={{ tailscale_hostname }}
        --advertise-routes={{ local_subnet }}
        --accept-dns=true
        --accept-routes=false
      register: tailscale_up_result
      changed_when: tailscale_up_result.rc == 0
      failed_when: false
  always:
    - name: Remove the Tailscale auth key file
      ansible.builtin.file:
        path: /run/tailscale-authkey
        state: absent
      changed_when: false

- name: Record whether Tailscale is up
  ansible.builtin.set_fact:
    tailscale_up_ok: "{{ tailscale_connected or (tailscale_up_result.rc | default(1)) == 0 }}"

- name: Tailscale login failed — continuing without Tailscale
  ansible.builtin.debug:
    msg:
      - "WARNING: 'tailscale up' did not succeed (rc={{ tailscale_up_result.rc | default('n/a') }})."
      - "Remote access via Tailscale is DOWN until someone logs this node in again."
      - "Most likely the node key and the auth key in the vault (tailscale_auth_key) have both expired."
      - "Fix: create a new auth key (https://login.tailscale.com/admin/settings/keys), vault it,"
      - "or run 'sudo tailscale up' on the host once and disable key expiry for this node."
      - "{{ tailscale_up_result.stderr | default('') | regex_replace('tskey-[A-Za-z0-9-]+', 'tskey-REDACTED') }}"
  when: not tailscale_up_ok

- name: Refresh Tailscale options (already connected — update hostname/routes)
  ansible.builtin.command: >
    tailscale set
    --hostname={{ tailscale_hostname }}
    --advertise-routes={{ local_subnet }}
  register: tailscale_set_result
  changed_when: tailscale_set_result.rc == 0
  failed_when: false
  when: tailscale_connected

# ---- IP Forwarding for Subnet Routing -----------------------
# net.ipv4.ip_forward and net.ipv6.conf.all.forwarding (required for subnet
# routing) are owned by the `common` role (/etc/sysctl.d/99-k3s.conf), which
# runs before this role. Do not re-declare them here — a second sysctl file
# would create two sources of truth for the same kernel parameters.

# ---- Verify Connection --------------------------------------
- name: Get final Tailscale status
  ansible.builtin.command: tailscale status
  register: tailscale_final_status
  changed_when: false
  retries: 6
  delay: 5
  until: tailscale_final_status.rc == 0
  when: tailscale_up_ok

- name: Get Tailscale IP address
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip
  changed_when: false
  failed_when: false
  when: tailscale_up_ok

- name: Display Tailscale connection info
  ansible.builtin.debug:
    msg:
      - "Tailscale status: Connected"
      - "Tailscale IP: {{ tailscale_ip.stdout | default('unknown') }}"
      - "Hostname: {{ tailscale_hostname }}"
      - "Advertised subnet: {{ local_subnet }}"
      - "NOTE: Approve the advertised subnet route in the admin panel:"
      - "      https://login.tailscale.com/admin/machines"
  when: tailscale_up_ok
