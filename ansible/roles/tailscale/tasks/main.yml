---
# ============================================================
# tailscale/tasks/main.yml — Tailscale VPN installation
# ============================================================

# ---- Add Tailscale Repository -------------------------------
- name: Create directory for APT keyrings
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'

- name: Download Tailscale GPG signing key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ tailscale_repo_codename }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
    force: false

- name: Add Tailscale APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
      https://pkgs.tailscale.com/stable/ubuntu {{ tailscale_repo_codename }} main
    filename: tailscale
    state: present
    update_cache: true

# ---- Install Tailscale --------------------------------------
# `state: latest` when auto_upgrade is on so we always run the most recent
# Tailscale client; `state: present` otherwise to honour any local pin.
- name: Install (or upgrade) tailscale package
  ansible.builtin.apt:
    name: tailscale
    state: "{{ 'latest' if auto_upgrade | bool else 'present' }}"
    update_cache: true

# ---- Enable tailscaled service ------------------------------
- name: Enable and start tailscaled service
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for tailscaled to be ready
  ansible.builtin.wait_for:
    path: /var/run/tailscale/tailscaled.sock
    state: present
    timeout: 30

# ---- Check Existing Connection ------------------------------
# `tailscale status --json` answers in every state; BackendState is "Running"
# when connected and e.g. "NeedsLogin" when the node key expired or the node
# was logged out.
- name: Check current Tailscale connection status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_raw
  changed_when: false
  failed_when: false

- name: Parse Tailscale status
  ansible.builtin.set_fact:
    tailscale_connected: >-
      {{
        (tailscale_status_raw.stdout | from_json).BackendState == 'Running'
        if tailscale_status_raw.rc == 0 and tailscale_status_raw.stdout | length > 0
        else false
      }}

# Remembered separately: tailscale_connected is re-evaluated after a login.
- name: Remember whether Tailscale was connected at the start of the run
  ansible.builtin.set_fact:
    tailscale_was_connected: "{{ tailscale_connected | bool }}"

- name: Display current Tailscale state
  ansible.builtin.debug:
    msg: "Tailscale connected: {{ tailscale_connected }}"

# ---- Connect to Tailscale -----------------------------------
# The auth key is handed over as `--auth-key=file:...`, so it never shows up in
# the process list. (The `tailscale` CLI does not read TS_AUTHKEY from the
# environment — that is a containerboot/tsnet convention. Passed that way the
# key was silently ignored and `tailscale up` waited for a browser login.)
#
# A failed login must not fail the play: the key in the vault expires after at
# most 90 days, and this role runs unattended every morning. `--timeout` bounds
# the wait, errors are tolerated and reported as a warning further down.
- name: Log in to Tailscale (only when not connected)
  when: not tailscale_was_connected
  block:
    - name: Write the Tailscale auth key to a root-only file
      ansible.builtin.copy:
        content: "{{ tailscale_auth_key }}"
        dest: "{{ tailscale_authkey_file }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: Connect to Tailscale and advertise the local subnet
      ansible.builtin.command: >
        tailscale up
        --auth-key=file:{{ tailscale_authkey_file }}
        --timeout={{ tailscale_up_timeout }}
        --hostname={{ tailscale_hostname }}
        --advertise-routes={{ local_subnet }}
        --accept-dns=true
        --accept-routes=false
      register: tailscale_up_result
      changed_when: tailscale_up_result.rc == 0
      failed_when: false
      no_log: true
      # Second line of defence in case `--timeout` does not end the command.
      timeout: 180
  rescue:
    - name: Tailscale login attempt could not be carried out
      ansible.builtin.debug:
        msg: "WARNING: the Tailscale login attempt failed before `tailscale up` returned — see the task above."
  always:
    - name: Remove the Tailscale auth key file
      ansible.builtin.file:
        path: "{{ tailscale_authkey_file }}"
        state: absent

- name: Re-check Tailscale state after the login attempt
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_after_up
  changed_when: false
  failed_when: false
  when: not tailscale_was_connected

- name: Parse Tailscale status after the login attempt
  ansible.builtin.set_fact:
    tailscale_backend_state: "{{ (tailscale_status_after_up.stdout | from_json).BackendState | default('unknown') }}"
    tailscale_connected: "{{ (tailscale_status_after_up.stdout | from_json).BackendState | default('') == 'Running' }}"
  when:
    - not tailscale_was_connected
    - tailscale_status_after_up.rc == 0
    - tailscale_status_after_up.stdout | length > 0

- name: Tailscale is NOT connected — skipping the remaining Tailscale tasks
  ansible.builtin.debug:
    msg:
      - "WARNING: Tailscale is not connected (state: {{ tailscale_backend_state | default('unknown') }})."
      - "`tailscale up` said: {{ tailscale_up_result.stderr | default('no output', true) | regex_replace('tskey-[A-Za-z0-9_-]+', '<auth key>') }}"
      - "Most likely the node key expired and the auth key in the vault is used up or expired too."
      - "Fix: create a new auth key (https://login.tailscale.com/admin/settings/keys), store it with"
      - "`ansible-vault encrypt_string ... --name tailscale_auth_key` and re-run — or log in once by hand:"
      - "`sudo tailscale up --hostname={{ tailscale_hostname }} --advertise-routes={{ local_subnet }} --accept-dns=true --accept-routes=false`"
  when: not tailscale_connected

# ---- Keep hostname / advertised routes in sync --------------
# `tailscale set` reports nothing about whether it changed anything, so read
# the current preferences and only call it when they differ. Not needed right
# after `tailscale up`, which has just applied the same flags.
- name: Read current Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs_raw
  changed_when: false
  failed_when: false
  when: tailscale_was_connected

# If the preferences cannot be read, fall back to calling `tailscale set`.
- name: Decide whether Tailscale options need an update
  ansible.builtin.set_fact:
    tailscale_set_needed: >-
      {{
        (tailscale_prefs.Hostname | default('') != tailscale_hostname)
        or ((tailscale_prefs.AdvertiseRoutes | default([], true) | sort) != [local_subnet])
      }}
  vars:
    tailscale_prefs: >-
      {{
        tailscale_prefs_raw.stdout | from_json
        if tailscale_prefs_raw.rc == 0 and (tailscale_prefs_raw.stdout | trim).startswith('{')
        else {}
      }}
  when: tailscale_was_connected

- name: Refresh Tailscale options (hostname or advertised routes differ)
  ansible.builtin.command: >
    tailscale set
    --hostname={{ tailscale_hostname }}
    --advertise-routes={{ local_subnet }}
  changed_when: true
  when:
    - tailscale_was_connected
    - tailscale_set_needed | bool

# ---- IP Forwarding for Subnet Routing -----------------------
# net.ipv4.ip_forward and net.ipv6.conf.all.forwarding (required for subnet
# routing) are owned by the `common` role (/etc/sysctl.d/99-k3s.conf), which
# runs before this role. Do not re-declare them here — a second sysctl file
# would create two sources of truth for the same kernel parameters.

# ---- Verify Connection --------------------------------------
- name: Get final Tailscale status
  ansible.builtin.command: tailscale status
  register: tailscale_final_status
  changed_when: false
  retries: 6
  delay: 5
  until: tailscale_final_status.rc == 0
  when: tailscale_connected

- name: Get Tailscale IP address
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip
  changed_when: false
  failed_when: false
  when: tailscale_connected

- name: Display Tailscale connection info
  ansible.builtin.debug:
    msg:
      - "Tailscale status: Connected"
      - "Tailscale IP: {{ tailscale_ip.stdout | default('unknown') }}"
      - "Hostname: {{ tailscale_hostname }}"
      - "Advertised subnet: {{ local_subnet }}"
      - "NOTE: Approve the advertised subnet route in the admin panel:"
      - "      https://login.tailscale.com/admin/machines"
  when: tailscale_connected
