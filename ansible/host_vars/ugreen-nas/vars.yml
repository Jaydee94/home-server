---
ansible_become_password: "{{ vault_nas_become_password }}"

# ---- Portainer ---------------------------------------------
portainer_base_dir: /opt/portainer
portainer_http_port: 9000
portainer_https_port: 9444
portainer_agent_port: 8002

# ---- Paperless-NGX ------------------------------------------
paperless_base_dir: /opt/paperless
paperless_http_port: 8000
paperless_ai_enabled: false

paperless_admin_user: admin
paperless_admin_email: admin@example.com
paperless_admin_password: "{{ vault_paperless_admin_password }}"

paperless_db_password: "{{ vault_paperless_db_password }}"
paperless_secret_key: "{{ vault_paperless_secret_key }}"

# Backup-Archive auf das RAID-Volume statt auf die 19-GB-Systempartition (eMMC),
# auf der /opt/paperless liegt — siehe docs/26-backup.md.
paperless_backup_dir: /volume1/paperless-backups
paperless_backup_required_mount: /volume1
paperless_backup_textfile_dir: "{{ node_exporter_base_dir }}/textfile"
# Optional, Default aus = nur Log (siehe docs/26-backup.md):
# paperless_backup_notify_url: "https://ntfy.sh/<topic>"
# paperless_backup_secondary_dir: /mnt/@usb/<disk>/paperless-backups

# ---- Node Exporter / cAdvisor -------------------------------
node_exporter_base_dir: /opt/node-exporter
cadvisor_port: 18080

# ---- Jellyfin media (UGOS SMB-Share "media") ----------------
# On-disk-Pfad des "media"-Shares; ggf. Volume-Nummer anpassen (/volume2/...).
jellyfin_media_base_dir: /volume1/media
