---
# Namespace isolation: allow ingress from pods in this namespace, from
# Traefik (kube-system), from monitoring (vmagent scrapes MinIO, see
# argocd/apps/monitoring/templates/vmservicescrape-minio.yaml), and from
# argo-workflows (its S3 artifact repository points at
# minio.minio.svc.cluster.local:9000, see
# argocd/apps/argo-workflows/values.yaml). Everything else is blocked.
# See docs/23-network-policies.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-namespace-isolation
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argo-workflows
