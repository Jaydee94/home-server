---
prometheus-blackbox-exporter:
  config:
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: []  # defaults to 2xx
          follow_redirects: true
      # Plain TCP connect — for things that do not speak HTTP (SMB, MQTT).
      tcp_connect:
        prober: tcp
        timeout: 5s
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  # VMProbe übernimmt die Scrape-Konfiguration; ServiceMonitor deaktivieren.
  serviceMonitor:
    enabled: false
