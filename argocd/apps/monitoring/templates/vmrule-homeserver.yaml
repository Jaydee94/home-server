---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homeserver-custom-rules
  namespace: monitoring
spec:
  groups:

    # ── Node / Host ─────────────────────────────────────────────────────────
    - name: homeserver.node
      rules:
        - alert: NodeExporterDown
          expr: up{job="node-exporter"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: >-
              Node exporter down on
              {{`{{ $labels.instance }}`}}
            description: >-
              node-exporter on
              {{`{{ $labels.instance }}`}}
              has been unreachable for >2 min.
              Host metrics (CPU, RAM, disk) are no longer collected.

        - alert: HostHighCPU
          expr: >-
            (1 - avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              High CPU on
              {{`{{ $labels.instance }}`}}:
              {{`{{ $value | printf "%.0f" }}`}}%
            description: >-
              CPU usage on
              {{`{{ $labels.instance }}`}}
              has been above 90% for 10 min.

        - alert: HostMemoryCritical
          expr: >-
            (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Memory critical on
              {{`{{ $labels.instance }}`}}:
              {{`{{ $value | printf "%.0f" }}`}}%
            description: >-
              Available RAM on
              {{`{{ $labels.instance }}`}}
              is below 10%.

        - alert: HostDiskAlmostFull
          expr: >-
            (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                 / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              Disk
              {{`{{ $labels.mountpoint }}`}}
              on
              {{`{{ $labels.instance }}`}}
              is
              {{`{{ $value | printf "%.0f" }}`}}%
              full
            description: >-
              Filesystem
              {{`{{ $labels.mountpoint }}`}}
              ({{`{{ $labels.device }}`}}) on
              {{`{{ $labels.instance }}`}}
              is above 80% capacity.

        - alert: HostDiskCritical
          expr: >-
            (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                 / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Disk
              {{`{{ $labels.mountpoint }}`}}
              on
              {{`{{ $labels.instance }}`}}
              is
              {{`{{ $value | printf "%.0f" }}`}}%
              full — act now
            description: >-
              Less than 10% free on
              {{`{{ $labels.mountpoint }}`}}
              ({{`{{ $labels.device }}`}}) of
              {{`{{ $labels.instance }}`}}.

        - alert: HostNetworkInterfaceDown
          expr: >-
            node_network_up{device=~"en.*|eth.*|wlan.*|wl.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Netzwerk-Interface
              {{`{{ $labels.device }}`}}
              auf
              {{`{{ $labels.instance }}`}}
              ist down
            description: >-
              Physisches Interface
              {{`{{ $labels.device }}`}}
              hat seit 5 min keinen Link.
              Tailscale-, Docker-, Bridge- und virtuelle Interfaces sind ausgeschlossen.

    # ── Kubernetes ──────────────────────────────────────────────────────────
    - name: homeserver.kubernetes
      rules:
        # Crash loops and unschedulable pods are covered by the default rules
        # KubePodCrashLooping and KubePodNotReady. The former custom
        # PodCrashLooping (increase[15m] > 3, for: 0m) flapped with every
        # back-off cycle and was the single noisiest alert.
        - alert: PodOOMKilled
          expr: >-
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: >-
              Pod
              {{`{{ $labels.namespace }}`}}/{{`{{ $labels.pod }}`}}
              was OOMKilled
            description: >-
              Container
              {{`{{ $labels.container }}`}}
              was killed by the OOM killer.
              Consider raising its memory limit.

        - alert: DeploymentReplicasMissing
          expr: >-
            kube_deployment_status_replicas_available
              < kube_deployment_spec_replicas
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              {{`{{ $labels.namespace }}`}}/{{`{{ $labels.deployment }}`}}
              has fewer replicas than desired
            description: >-
              Deployment
              {{`{{ $labels.namespace }}`}}/{{`{{ $labels.deployment }}`}}
              has fewer available replicas than specified.

        - alert: PVCAlmostFull
          expr: >-
            (1 - kubelet_volume_stats_available_bytes
                 / kubelet_volume_stats_capacity_bytes) * 100 > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: >-
              PVC
              {{`{{ $labels.namespace }}`}}/{{`{{ $labels.persistentvolumeclaim }}`}}
              is
              {{`{{ $value | printf "%.0f" }}`}}%
              full
            description: >-
              PVC
              {{`{{ $labels.namespace }}`}}/{{`{{ $labels.persistentvolumeclaim }}`}}
              has less than 20% free space remaining.

        - alert: PVCCritical
          expr: >-
            (1 - kubelet_volume_stats_available_bytes
                 / kubelet_volume_stats_capacity_bytes) * 100 > 90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              PVC
              {{`{{ $labels.namespace }}`}}/{{`{{ $labels.persistentvolumeclaim }}`}}
              is
              {{`{{ $value | printf "%.0f" }}`}}%
              full — act now
            description: >-
              PVC
              {{`{{ $labels.namespace }}`}}/{{`{{ $labels.persistentvolumeclaim }}`}}
              has less than 10% free space.

    # ── ArgoCD ──────────────────────────────────────────────────────────────
    - name: homeserver.argocd
      rules:
        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              ArgoCD app
              {{`{{ $labels.name }}`}}
              is degraded
            description: >-
              ArgoCD application
              {{`{{ $labels.name }}`}}
              (project:
              {{`{{ $labels.project }}`}})
              has been in Degraded health for >5 min.

        # Progressing / Missing / Unknown are not "Degraded", so an app can hang
        # there forever without the alert above firing (mosquitto did for a week).
        - alert: ArgoCDAppNotHealthy
          expr: argocd_app_info{health_status!~"Healthy|Suspended|Degraded"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              ArgoCD app
              {{`{{ $labels.name }}`}}
              hängt in
              {{`{{ $labels.health_status }}`}}
            description: >-
              ArgoCD application
              {{`{{ $labels.name }}`}}
              ist seit >30 min im Zustand
              {{`{{ $labels.health_status }}`}}.
              Prüfe `kubectl -n {{`{{ $labels.dest_namespace }}`}} get pods`.

        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              ArgoCD app
              {{`{{ $labels.name }}`}}
              out of sync for 30+ min
            description: >-
              ArgoCD application
              {{`{{ $labels.name }}`}}
              has an OutOfSync status.
              Check http://192.168.178.127:30080.

        - alert: ArgoCDAppSyncFailed
          expr: argocd_app_info{operation_state="Failed"} == 1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: >-
              ArgoCD app
              {{`{{ $labels.name }}`}}
              sync failed
            description: >-
              The last sync of ArgoCD application
              {{`{{ $labels.name }}`}}
              failed.

    # ── NAS ─────────────────────────────────────────────────────────────────
    - name: homeserver.nas
      rules:
        - alert: NASNodeExporterDown
          expr: up{job="ugreen-nas-node-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "UGREEN NAS node-exporter unreachable"
            description: >-
              The node-exporter on the UGREEN NAS (192.168.178.118:9100) has
              been down for >5 min. NAS host metrics are missing.

        - alert: NASCAdvisorDown
          expr: up{job="ugreen-nas-cadvisor"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "UGREEN NAS cAdvisor unreachable"
            description: >-
              cAdvisor on the UGREEN NAS (192.168.178.118:18080) is down.
              Docker container metrics are missing.

    # ── Pi-hole ──────────────────────────────────────────────────────────────
    - name: homeserver.pihole
      rules:
        - alert: PiholeDown
          expr: pihole_status == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pi-hole is DISABLED"
            description: >-
              Pi-hole ad-blocking is disabled. DNS queries are no longer
              being filtered.

        - alert: PiholeExporterDown
          expr: absent(pihole_status)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pi-hole exporter is down — no metrics"
            description: >-
              The pihole-exporter has stopped reporting. Pi-hole health
              is unknown.

    # ── Traefik ──────────────────────────────────────────────────────────────
    - name: homeserver.traefik
      rules:
        - alert: TraefikHighErrorRate
          expr: >-
            sum by(router) (
              rate(traefik_router_requests_total{code=~"5.."}[5m])
            )
            /
            sum by(router) (
              rate(traefik_router_requests_total[5m])
            ) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: >-
              Traefik router
              {{`{{ $labels.router }}`}}
              has >5% 5xx errors
            description: >-
              More than 5% of requests through Traefik router
              {{`{{ $labels.router }}`}}
              are returning 5xx status codes.

    # ── Media & Home-Automation ──────────────────────────────────────────────
    - name: homeserver.services
      rules:
        - alert: MediaAPIExporterDown
          expr: up{job="media-api-exporter"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Media API exporter is down"
            description: >-
              The media-api-exporter (Sonarr/Radarr/Prowlarr metrics bridge)
              is unreachable. Media-stack health data is missing.

        - alert: MosquittoDown
          # There is no scrape target in the mosquitto namespace, so the former
          # up{namespace="mosquitto"} == 0 could never fire. Use kube-state-metrics;
          # the absent() arm also covers a deleted StatefulSet.
          expr: >-
            kube_statefulset_status_replicas_ready{namespace="mosquitto", statefulset="mosquitto"} < 1
            or absent(kube_statefulset_status_replicas_ready{namespace="mosquitto", statefulset="mosquitto"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Mosquitto MQTT broker is down"
            description: >-
              The Mosquitto MQTT broker is unreachable. Home Assistant
              MQTT-based devices will stop reporting.

    # ── KubeVirt ─────────────────────────────────────────────────────────────
    - name: homeserver.kubevirt
      rules:
        - alert: KubeVirtVMNotRunning
          expr: >-
            kubevirt_vmi_info{phase=~"failed|unknown"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              KubeVirt VMI
              {{`{{ $labels.name }}`}}
              in Phase
              {{`{{ $labels.phase }}`}}
            description: >-
              VMI
              {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}}
              befindet sich in Phase
              {{`{{ $labels.phase }}`}}.
              Prüfe `kubectl get vmi -A`.

    # ── systemd ──────────────────────────────────────────────────────────────
    - name: homeserver.systemd
      rules:
        - alert: SystemdUnitFailed
          expr: node_systemd_unit_state{state="failed"} == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: >-
              systemd-Unit
              {{`{{ $labels.name }}`}}
              auf
              {{`{{ $labels.instance }}`}}
              fehlgeschlagen
            description: >-
              Die systemd-Unit ist in state=failed.
              Prüfe mit `systemctl status {{`{{ $labels.name }}`}}`.

    # ── Blackbox / HTTP-Probes ────────────────────────────────────────────────
    - name: homeserver.blackbox
      rules:
        - alert: ServiceEndpointDown
          expr: probe_success{job=~"homeserver-blackbox.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Service
              {{`{{ $labels.instance }}`}}
              antwortet nicht
            description: >-
              Probe von
              {{`{{ $labels.instance }}`}}
              schlägt seit 5 min fehl.
              Prüfe Traefik-Logs und Pod-Status (bzw. NAS / MetalLB bei TCP-Zielen).

    # ── cert-manager ─────────────────────────────────────────────────────────
    - name: homeserver.certificates
      rules:
        - alert: CertificateExpiringSoon
          expr: >-
            certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              Zertifikat
              {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}}
              läuft in
              {{`{{ $value | humanizeDuration }}`}}
              ab
            description: >-
              cert-manager hat das Zertifikat nicht rechtzeitig erneuert.
              Prüfe `kubectl -n {{`{{ $labels.namespace }}`}} describe certificate {{`{{ $labels.name }}`}}`.

        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              Zertifikat
              {{`{{ $labels.namespace }}`}}/{{`{{ $labels.name }}`}}
              ist nicht Ready
            description: >-
              cert-manager kann das Zertifikat seit >30 min nicht ausstellen.

    # ── Disk / SMART ─────────────────────────────────────────────────────────
    # Metrics from smartctl-exporter v0.15.0 (argocd/apps/smartctl-exporter),
    # names taken from its metrics.go. The host has one disk, a Samsung PM981a
    # NVMe (`device="nvme0"`).
    - name: homeserver.disk
      rules:
        - alert: DiskSmartStatusFailed
          expr: smartctl_device_smart_status != 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              SMART-Status von
              {{`{{ $labels.device }}`}}
              ist nicht mehr „passed“
            description: >-
              Das Laufwerk meldet selbst einen Fehler. Backup prüfen
              (docs/26-backup.md) und den Tausch planen.

        # Bitmask from the NVMe health log: spare below threshold, temperature
        # out of range, reliability degraded, read-only, volatile backup failed.
        - alert: DiskCriticalWarning
          expr: smartctl_device_critical_warning != 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              NVMe
              {{`{{ $labels.device }}`}}
              meldet critical_warning =
              {{`{{ $value }}`}}
            description: >-
              Der Controller hat ein Critical-Warning-Bit gesetzt (Bit 0 Spare,
              1 Temperatur, 2 Zuverlässigkeit, 3 read-only, 4 Backup).
              Details in Grafana → Explore: `smartctl_device_available_spare`,
              `smartctl_device_temperature`.

        - alert: DiskWearHigh
          expr: smartctl_device_percentage_used > 80
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              NVMe
              {{`{{ $labels.device }}`}}
              hat
              {{`{{ $value | printf "%.0f" }}`}}%
              ihrer Schreib-Lebensdauer verbraucht
            description: >-
              `percentage_used` ist die Herstellerschätzung der verbrauchten
              Lebensdauer (kann über 100 steigen). Ab 80% Ersatz einplanen.

        # Lifetime counter of unrecovered data-integrity errors: once it is
        # above 0 this stays firing until the disk is replaced. That is
        # intended; silence it in Alertmanager after it has been looked at.
        - alert: DiskMediaErrors
          expr: smartctl_device_media_errors > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              NVMe
              {{`{{ $labels.device }}`}}
              hat
              {{`{{ $value | printf "%.0f" }}`}}
              Media-Errors
            description: >-
              Der Controller konnte Daten nicht fehlerfrei lesen oder schreiben
              (unkorrigierbare ECC-/CRC-Fehler). Backup prüfen, Laufwerk tauschen.

        # Composite temperature. Its 30-day maximum on this host was 59 °C
        # (node_hwmon_temp_celsius, 2026-11-13); the drive's own warning
        # threshold is 84 °C (hwmon temp1_max).
        - alert: DiskTemperatureHigh
          expr: smartctl_device_temperature{temperature_type="current"} > 70
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: >-
              NVMe
              {{`{{ $labels.device }}`}}
              ist seit 30 min über 70 °C
              ({{`{{ $value | printf "%.0f" }}`}} °C)
            description: >-
              Üblich sind hier 54–59 °C; die Warnschwelle des Laufwerks selbst
              liegt bei 84 °C. Luftstrom und Last (Downloads, VM) prüfen.

        # `up` alone is not enough: if smartctl cannot read the device, the
        # exporter stays up and exports no device metrics. Not covered: if
        # reads start failing after a first success, the exporter keeps
        # serving the last good result (readjson.go only replaces its cache
        # on success) and exports no age for it.
        - alert: SmartctlExporterDown
          expr: >-
            up{job="monitoring/smartctl-exporter"} == 0
            or absent(up{job="monitoring/smartctl-exporter"})
            or absent(smartctl_device_smart_status)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "smartctl-exporter liefert keine SMART-Daten"
            description: >-
              Der Exporter ist nicht erreichbar oder liest das Laufwerk nicht.
              Die Disk-Alerts sind damit blind. Prüfe
              `kubectl -n smartctl-exporter get pods` und die Pod-Logs.
