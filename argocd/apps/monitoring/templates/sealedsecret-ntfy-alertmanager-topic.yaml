---
# SealedSecret for the ntfy push-notification topic.
#
# SETUP (one-time, run on the homeserver or any machine with kubeseal + cluster access):
#
#   TOPIC="$(openssl rand -base64 24 | tr -d '+/=' | head -c 32)"
#   kubectl create secret generic ntfy-alertmanager-topic \
#     --namespace=monitoring \
#     --dry-run=client \
#     --from-literal="ntfy-topic.scfg=ntfy { server https://ntfy.sh\n  topic $TOPIC\n}" \
#     -o yaml | kubeseal --controller-name=sealed-secrets \
#                        --controller-namespace=kube-system \
#                        --format yaml > \
#     argocd/apps/monitoring/templates/sealedsecret-ntfy-alertmanager-topic.yaml
#
# After sealing: open the ntfy app on your phone and subscribe to the same topic.
# Then commit the resulting file (the encrypted data is safe to store publicly).
#
# NOTE: encryptedData below is a placeholder — ArgoCD will show SyncError until
# you replace this file with real sealed output (intentional fail-closed behaviour).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ntfy-alertmanager-topic
  namespace: monitoring
spec:
  encryptedData:
    ntfy-topic.scfg: "PLACEHOLDER_RUN_KUBESEAL_SEE_COMMENT_ABOVE"
  template:
    metadata:
      name: ntfy-alertmanager-topic
      namespace: monitoring
    type: Opaque
