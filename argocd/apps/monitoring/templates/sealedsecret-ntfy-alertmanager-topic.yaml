---
# SealedSecret for the ntfy push-notification topic.
# Encrypted with the sealed-secrets-controller in namespace sealed-secrets.
#
# To update the topic (e.g. after a rotation):
#   TOPIC="$(openssl rand -base64 24 | tr -d '+/=' | head -c 32)"
#   printf 'ntfy {\n  server https://ntfy.sh\n  topic %s\n}\n' "$TOPIC" | \
#   kubectl create secret generic ntfy-alertmanager-topic \
#     --namespace=monitoring --dry-run=client \
#     --from-file='ntfy-topic.scfg=/dev/stdin' -o yaml | \
#   kubeseal --controller-name=sealed-secrets-controller \
#            --controller-namespace=sealed-secrets --format yaml > \
#   argocd/apps/monitoring/templates/sealedsecret-ntfy-alertmanager-topic.yaml
#   # Then subscribe to $TOPIC in the ntfy app on your phone.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ntfy-alertmanager-topic
  namespace: monitoring
spec:
  encryptedData:
    ntfy-topic.scfg: 
  template:
    metadata:
      name: ntfy-alertmanager-topic
      namespace: monitoring
    type: Opaque
