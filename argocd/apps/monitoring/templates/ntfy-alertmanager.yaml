---
# Translates Alertmanager webhook payloads into ntfy push notifications.
# Source: https://git.xenrox.net/~xenrox/ntfy-alertmanager
#
# Notification format:
#   Title:    alertname label
#   Message:  annotations.description
#   Priority: critical→urgent, warning→high (via configmap-ntfy-alertmanager.yaml)
#
# To change the topic: edit configmap-ntfy-alertmanager.yaml, update the
# ntfy app subscription on your phone, and push — ArgoCD syncs in ~3 min.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy-alertmanager
  template:
    metadata:
      labels:
        app: ntfy-alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: bridge
          # renovate: datasource=docker depName=xenrox/ntfy-alertmanager
          image: xenrox/ntfy-alertmanager:0.5.0
          args:
            - --config=/etc/ntfy-alertmanager/config.yml
          ports:
            - name: webhook
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy-alertmanager
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: ntfy-alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy-alertmanager
  namespace: monitoring
spec:
  selector:
    app: ntfy-alertmanager
  ports:
    - name: webhook
      port: 8080
      targetPort: 8080
