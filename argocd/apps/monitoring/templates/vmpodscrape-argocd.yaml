apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: argocd
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchExpressions:
      - key: app.kubernetes.io/part-of
        operator: In
        values: [argocd]
      # dex-server is not configured (no OIDC/SSO) → port 5558 not listening.
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [argocd-dex-server]
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
