---
# Gotify app token for the alertmanager-gotify-bridge.
# App "AlertManager" was created via the Gotify API.
# Re-seal if the token is rotated:
#   echo -n "<NEW_TOKEN>" | kubeseal --raw \
#     --namespace monitoring --name alertmanager-gotify-bridge \
#     --controller-name sealed-secrets-controller \
#     --controller-namespace sealed-secrets \
#     --from-file=/dev/stdin
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-gotify-bridge
  namespace: monitoring
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: alertmanager-gotify-bridge
      namespace: monitoring
