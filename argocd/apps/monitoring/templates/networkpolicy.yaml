---
# Namespace isolation: allow ingress from pods in this namespace (Grafana,
# VMSingle, VMAgent, VMAlert, Alertmanager, kube-state-metrics all talk to
# each other here), from Traefik (kube-system, Grafana ingress), from
# homepage (dashboard widget calls monitoring-grafana.monitoring.svc.cluster.
# local, see argocd/apps/homepage/values.yaml), and from gameserver-ui (reads
# VictoriaMetrics directly via vmsingle-monitoring-victoria-metrics-k8s-stack.
# monitoring.svc.cluster.local:8428, see
# argocd/apps/gameserver-ui/values.yaml). Everything else is blocked.
# See docs/23-network-policies.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitoring-namespace-isolation
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: homepage
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gameserver-ui
