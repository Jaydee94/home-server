---
# ============================================================
# Monitoring stack — values for victoria-metrics-k8s-stack.
# All keys live under `victoria-metrics-k8s-stack:` because that
# is the dependency name in Chart.yaml.
#
# Upstream values.yaml reference:
#   https://github.com/VictoriaMetrics/helm-charts/blob/master/charts/victoria-metrics-k8s-stack/values.yaml
# Chart docs:
#   https://docs.victoriametrics.com/helm/victoria-metrics-k8s-stack/
# ============================================================

victoria-metrics-k8s-stack:
  global:
    clusterLabel: homeserver
    cluster:
      dnsDomain: cluster.local.

  # ---- VictoriaMetrics Operator ----------------------------
  # Installs VM CRDs (VMSingle, VMAgent, VMAlert, VMServiceScrape, ...).
  # `crds.plain: true` renders CRDs as plain templates so ArgoCD can apply
  # them — required because ArgoCD ignores Helm's `crds/` folder by default.
  victoria-metrics-operator:
    enabled: true
    crds:
      plain: true
      cleanup:
        # Deleting the chart leaves CRDs on the cluster (safer default).
        enabled: false
    admissionWebhooks:
      # Avoid sync-loop races against the operator's webhook on first install.
      policy: Ignore
    operator:
      # Auto-convert Prometheus ServiceMonitor → VMServiceScrape so apps
      # that ship Prometheus-style monitors work out of the box.
      disable_prometheus_converter: false

  # ---- VictoriaMetrics single-node TSDB --------------------
  # Single-node is plenty for a home server. Switch to vmcluster only if
  # you ever push > 1M active series.
  vmsingle:
    enabled: true
    spec:
      retentionPeriod: "30d"       # h/d/w/y; unit-less = months
      replicaCount: 1
      extraArgs:
        # Drop scrapes from misbehaving targets instead of blowing memory.
        memory.allowedPercent: "60"
      storage:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi

  # ---- VMAgent ---------------------------------------------
  # Scrapes everything matching a VMServiceScrape / VMPodScrape /
  # VMNodeScrape / VMStaticScrape in any namespace. ServiceMonitors are
  # auto-converted by the operator.
  vmagent:
    enabled: true
    spec:
      selectAllByDefault: true
      scrapeInterval: 30s
      externalLabels:
        cluster: homeserver
      extraArgs:
        promscrape.streamParse: "true"
        # NAS cAdvisor response is ~19 MB; raise the global ceiling to 32 MB.
        promscrape.maxScrapeSize: "32MB"
      # The operator default (200m) was hit: the scrape of the API server (~74k
      # samples) and of the NAS cAdvisor ran late, up{job="apiserver"} came
      # every 2-3 min instead of 30 s and KubeAPIDown (absent(up)) fired.
      # 500m was hit too (TooHighCPUUsage); k3s serves the same ~74k samples
      # on the kubelet's /metrics, and four kubelet scrapes take 17-35 s each.
      resources:
        requests:
          cpu: 50m
          memory: 200Mi
        limits:
          cpu: 1000m
          memory: 500Mi

  # ---- VMAlert ---------------------------------------------
  vmalert:
    enabled: true
    spec:
      selectAllByDefault: true
      evaluationInterval: 30s

  # ---- Alertmanager ----------------------------------------
  # Routes critical/warning alerts to the alertmanager-gotify-bridge
  # (monitoring namespace), which translates Alertmanager webhooks into
  # Gotify push notifications. Info-severity alerts are silently dropped.
  # The bridge reads its Gotify app token from the SealedSecret
  # sealedsecret-alertmanager-gotify-bridge.yaml — create the token first
  # in the Gotify UI, then run `make vault-edit` or kubeseal to seal it.
  alertmanager:
    enabled: true
    spec:
      replicaCount: 1
    config:
      route:
        receiver: gotify
        group_by: ["alertname", "namespace"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - receiver: blackhole
            matchers:
              - severity="info"
      receivers:
        - name: gotify
          webhook_configs:
            - url: "http://alertmanager-gotify-bridge.monitoring.svc.cluster.local:8080/gotify_webhook"
              send_resolved: true
        - name: blackhole
      inhibit_rules:
        - target_matchers:
            - severity=~"warning|info"
          source_matchers:
            - severity=critical
          equal:
            - namespace
            - alertname
        - target_matchers:
            - severity=info
          source_matchers:
            - severity=warning
          equal:
            - namespace
            - alertname

  # ---- Default alert rules ---------------------------------
  defaultRules:
    create: true
    # Disable rules for components k3s does not expose as separate pods:
    # controller-manager, scheduler, and etcd all run inside the single
    # k3s server process. kubeProxy is also baked in.
    groups:
      etcd:
        create: false
      kubeScheduler:
        create: false
      kubernetesSystemScheduler:
        create: false
      kubernetesSystemControllerManager:
        create: false

  # ---- Default dashboards (cluster, nodes, VM components) ---
  defaultDashboards:
    enabled: true
    defaultTimezone: browser
    dashboards:
      node-exporter-full:
        enabled: true
      victoriametrics-vmalert:
        enabled: true
      victoriametrics-operator:
        enabled: true

  # ---- Grafana --------------------------------------------
  # Exposed at http://grafana.homeserver via Traefik. Admin password is
  # stored in the SealedSecret `grafana-admin` (monitoring namespace).
  # See argocd/apps/monitoring/templates/sealedsecret-grafana-admin.yaml.
  grafana:
    enabled: true
    defaultDashboardsTimezone: browser

    plugins:
      - victoriametrics-metrics-datasource

    admin:
      existingSecret: "grafana-admin"
      userKey: admin-user
      passwordKey: admin-password

    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472

    initChownData:
      enabled: false

    persistence:
      enabled: true
      type: pvc
      storageClassName: local-path
      accessModes:
        - ReadWriteOnce
      size: 2Gi

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Sidecar picks up any ConfigMap labelled `grafana_dashboard=1` —
    # `defaultDashboards` above ships its dashboards this way, and you
    # can drop extra ConfigMaps in the `monitoring` namespace to add more.
    sidecar:
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        folder: /var/lib/grafana/dashboards
        searchNamespace: ALL
        provider:
          name: default
          orgid: 1
          foldersFromFilesStructure: true

    ingress:
      enabled: true
      ingressClassName: traefik
      annotations: {}
      labels: {}
      path: /
      pathType: Prefix
      hosts:
        - grafana.homeserver
      tls: []

    # Grafana itself is scraped by VMAgent.
    vmScrape:
      enabled: true

  # ---- prometheus-node-exporter ----------------------------
  # DaemonSet: one pod per node (only the home-server here), exposes host
  # CPU/RAM/disk/network/load. Mounts /proc and /sys read-only.
  prometheus-node-exporter:
    enabled: true
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 64Mi

  # ---- kube-state-metrics ----------------------------------
  kube-state-metrics:
    enabled: true
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

  # ---- Kubernetes component scraping ----------------------
  # Enabled where k3s actually exposes the metric.
  kubelet:
    enabled: true
    # k3s serves the API server's registry on the kubelet's /metrics too (the
    # same ~74k samples as the apiserver job), so the bucket families that the
    # apiserver job drops are dropped here as well. Only /metrics: the other
    # kubelet scrapes do not carry them. The list is the chart default plus
    # the last entry (a list replaces the default, it is not merged).
    #
    # The chart copies every node label onto every series (labelmap). On this
    # node that is 525 labels, 512 of them KubeVirt's feature labels
    # (cpu-feature.node.kubevirt.io/*, host-model-*, hyperv.*), so vmsingle
    # rejected every kubelet, cAdvisor, probes and resources row with
    # too_many_labels: no container metrics, KubeletDown firing, vmagent
    # burning CPU on rows that were thrown away. The labelmap stays (the other
    # 13 node labels are kept as before); the KubeVirt ones are dropped.
    # relabelConfigs applies to all four kubelet scrapes. It is the chart
    # default plus the labeldrop (a list replaces the default).
    vmScrape:
      spec:
        relabelConfigs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - action: labeldrop
            regex: ".*kubevirt.*"
          - source_labels: [__metrics_path__]
            target_label: metrics_path
          - target_label: job
            replacement: kubelet
    vmScrapes:
      kubelet:
        spec:
          metricRelabelConfigs:
            - action: labeldrop
              regex: (uid)
            - action: labeldrop
              regex: (id|name)
            - action: drop
              source_labels: [__name__]
              regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
            - action: drop
              source_labels: [__name__]
              regex: "(apiserver_request_duration_seconds|etcd_request_duration_seconds|\
                apiserver_request_body_size_bytes|apiserver_watch_list_duration_seconds|\
                apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|\
                apiserver_watch_events_sizes)_bucket"
  kubeApiServer:
    enabled: true
    # The scrape is ~74k series and took longer than the 30 s interval, so
    # vmagent sat at its CPU limit and every other sample was missing. These
    # histogram bucket families are 56% of it (~41.7k series) and no rule or
    # dashboard queries their _bucket series (checked 2026-10-22); _sum and
    # _count stay. The apiserver_request_sli_duration_seconds_* the rules use
    # stay too. The endpoint is the chart default plus metricRelabelConfigs
    # (a list replaces the default, it is not merged).
    vmScrape:
      spec:
        endpoints:
          - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
            port: https
            scheme: https
            tlsConfig:
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              serverName: kubernetes
            metricRelabelConfigs:
              - action: drop
                source_labels: [__name__]
                regex: "(apiserver_request_duration_seconds|etcd_request_duration_seconds|\
                  apiserver_request_body_size_bytes|apiserver_watch_list_duration_seconds|\
                  apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|\
                  apiserver_watch_events_sizes)_bucket"
  coreDns:
    enabled: true

  # Disabled — k3s bakes these into a single process bound to 127.0.0.1.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  # k3s ships an embedded SQLite datastore by default; no etcd to scrape.
  kubeEtcd:
    enabled: false
