---
# Catch-all IngressRoute: routes direct IP access (http://192.168.178.127)
# to the homepage dashboard. Priority 1 (lowest) so hostname-specific Ingress
# rules always win. Without this, Traefik returns 404 for requests without a
# matching Host header.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage-catchall
  namespace: {{ .Release.Namespace }}
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: homepage
          port: 3000
