---
# The secret URL path (MCP_SECRET_PATH) is the only authentication ha-mcp has.
# Restrict ingress to Traefik (kube-system) only, so no other in-cluster pod
# can even attempt to reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ha-mcp-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
