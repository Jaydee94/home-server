apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mosquitto
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
spec:
  # serviceName, podManagementPolicy, selector und volumeClaimTemplates sind
  # immutable — unverändert vom früheren helmforgedev-Chart übernommen, damit
  # das StatefulSet in-place aktualisiert wird und die PVC data-mosquitto-0
  # gebunden bleibt.
  serviceName: mosquitto-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "mosquitto.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mosquitto.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ printf "%s%s" .Values.sealedSecret.encryptedUsername .Values.sealedSecret.encryptedPassword | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1883
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1883
        runAsNonRoot: true
        runAsUser: 1883
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: generate-runtime-files
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              cp /config-template/mosquitto.conf.tmpl /work/mosquitto.conf
              # Das emptyDir überlebt Neustarts des Init-Containers (z. B. nach
              # einem Host-Reboot), und mosquitto_passwd -c (>= 2.1) weigert
              # sich, eine vorhandene Datei zu überschreiben ("File exists").
              # Ohne dieses rm hängt der Pod dann dauerhaft im Init-CrashLoop.
              rm -f /work/passwordfile
              mosquitto_passwd -b -c /work/passwordfile "$AUTH_USERNAME" "$AUTH_PASSWORD"
              chmod 0700 /work/passwordfile
          env:
            - name: AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.usernameKey }}
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.passwordKey }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: generated
              mountPath: /work
      containers:
        - name: mosquitto
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - mosquitto
          args:
            - -c
            - /mosquitto/config/mosquitto.conf
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: generated
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: generated
              mountPath: /mosquitto/config/generated
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config-template
          configMap:
            name: mosquitto-config
        - name: generated
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "mosquitto.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
