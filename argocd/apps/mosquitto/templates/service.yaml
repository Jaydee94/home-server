---
# Cluster-interner Zugriff (Home Assistant): mosquitto.mosquitto.svc:1883
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mosquitto.selectorLabels" . | nindent 4 }}
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
---
# Governing Service des StatefulSets (spec.serviceName).
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "mosquitto.selectorLabels" . | nindent 4 }}
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
