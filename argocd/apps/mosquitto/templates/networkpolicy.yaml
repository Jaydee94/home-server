apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mosquitto-broker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mosquitto.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mosquitto.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: mqtt
          protocol: TCP
