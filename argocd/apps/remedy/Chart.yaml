---
apiVersion: v2
name: remedy
description: Remedy, an AI operator for this home lab, installed from a release of its OCI chart.
type: application
# The wrapper's own version. Not the release: the release is the dependency below.
version: 0.1.0
keywords:
  - remedy
  - operator
home: https://github.com/Jaydee94/remedy
sources:
  - https://github.com/Jaydee94/remedy
maintainers:
  - name: home-server-admin
dependencies:
  - name: remedy
    repository: oci://ghcr.io/jaydee94/charts
    # Exact release of the Remedy chart (no ~ or ^). A bump of this version and of runner.cli in values.yaml are one
    # pull request: compare the pin with deploy/cli-pin.yaml at the release tag (2.1.292 and the same checksums
    # since 0.9.0). Check the release first: `helm show chart oci://ghcr.io/jaydee94/charts/remedy --version <X.Y.Z>`.
    version: "0.14.1"
