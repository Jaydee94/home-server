---
# ArgoCD manages itself: the ApplicationSet turns this directory into the
# Application `argocd` (namespace argocd), so a merged chart bump here is
# rolled out by ArgoCD within minutes.
#
# Single source of truth: ansible/roles/argocd reads the chart version from
# Chart.yaml and the `argo-cd:` block below for the one-time bootstrap
# (fresh cluster) and for `make argocd-recover`. Keep everything static here,
# Ansible does not template this file.
#
# The Application name `argocd` doubles as the Helm release name, so all
# resources keep the names of the original `helm install argocd` release
# (argocd-server, argocd-cm, ...).
argo-cd:
  crds:
    # Never let a sync prune or delete the Application/ApplicationSet/AppProject
    # CRDs: that would cascade to every Application in the cluster.
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false

  global:
    domain: argocd.homeserver

  server:
    insecure: true
    service:
      type: NodePort
      nodePortHttp: 30080
      nodePortHttps: 30443

  configs:
    cm:
      accounts.readonly: apiKey
      # Global ignoreDifferences — works with ServerSideApply (application-level
      # ignoreDifferences does not suppress OutOfSync with ArgoCD 3.x SSA default diff).
      # StatefulSet: Kubernetes 1.27+ adds persistentVolumeClaimRetentionPolicy
      # and volumeMode to VCT as defaults; suppress both globally.
      resource.customizations.ignoreDifferences.apps_StatefulSet: |
        jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.spec.volumeMode
      # VirtualMachine: KubeVirt injects domain.machine/firmware at admission;
      # runStrategy is managed by CronJobs, not ArgoCD.
      resource.customizations.ignoreDifferences.kubevirt.io_VirtualMachine: |
        jsonPointers:
        - /spec/runStrategy
        - /spec/template/metadata/annotations
        - /spec/template/spec/domain/machine
        - /spec/template/spec/domain/firmware
      # CRD: Kubernetes adds spec.conversion {strategy: None} and populates .status.
      resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
        jsonPointers:
        - /spec/conversion
        - /status
    rbac:
      policy.csv: |
        g, readonly, role:readonly
    params:
      server.insecure: "true"

  redis-ha:
    enabled: false

  controller:
    replicas: 1

  repoServer:
    replicas: 1

  applicationSet:
    replicas: 1
