{{- $enc := .Values.sealedSecret.encryptedData }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "webtrees.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  encryptedData:
    db-password: {{ required "sealedSecret.encryptedData.db-password is empty, see docs/27-webtrees.md" (index $enc "db-password") }}
    db-root-password: {{ required "sealedSecret.encryptedData.db-root-password is empty, see docs/27-webtrees.md" (index $enc "db-root-password") }}
    wt-password: {{ required "sealedSecret.encryptedData.wt-password is empty, see docs/27-webtrees.md" (index $enc "wt-password") }}
  template:
    metadata:
      name: {{ include "webtrees.secretName" . }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
