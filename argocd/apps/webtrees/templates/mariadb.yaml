{{- $name := include "webtrees.mariadb.fullname" . }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "webtrees.mariadb.labels" . | nindent 4 }}
  annotations:
    # Same protection as common.pvc: local-path wipes the data with the claim.
    argocd.argoproj.io/sync-options: Delete=false,Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mariadb.persistence.size }}
  storageClassName: {{ .Values.mariadb.persistence.storageClassName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "webtrees.mariadb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
  selector:
    {{- include "webtrees.mariadb.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "webtrees.mariadb.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "webtrees.mariadb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "webtrees.mariadb.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
          # The entrypoint starts as root, fixes the ownership of the data
          # directory and switches to the mysql user with gosu.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.env.DB_NAME | quote }}
            - name: MARIADB_USER
              value: {{ .Values.env.DB_USER | quote }}
            - name: MARIADB_PASSWORD_FILE
              value: /run/secrets/webtrees/db-password
            - name: MARIADB_ROOT_PASSWORD_FILE
              value: /run/secrets/webtrees/db-root-password
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: secrets
              mountPath: /run/secrets/webtrees
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        - name: secrets
          secret:
            secretName: {{ include "webtrees.secretName" . }}
            items:
              - key: db-password
                path: db-password
              - key: db-root-password
                path: db-root-password
