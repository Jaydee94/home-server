---
image:
  # Community image (no official one exists), rebuilt for every webtrees
  # release: https://github.com/NathanVaughn/webtrees-docker
  repository: ghcr.io/nathanvaughn/webtrees
  tag: "2.2.6"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# The entrypoint runs as root: it remaps www-data to PUID/PGID, chowns the data
# volume and then starts Apache, which drops to www-data. Only the capabilities
# for that are kept.
securityContext:
  allowPrivilegeEscalation: false
  # The entrypoint stops its setup-wizard Apache with SIGTERM, and Apache
  # signals its own workers. AppArmor on Ubuntu 26.04 denies signals inside the
  # container while kernel.apparmor_restrict_unprivileged_unconfined=1
  # (docs/gotchas.md#apparmor--container-signale). Can go once that sysctl is 0.
  appArmorProfile:
    type: Unconfined
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: webtrees.homeserver
      paths:
        - path: /
          pathType: Prefix
  tls: []

# /var/www/webtrees/data: config.ini.php, media files, GEDCOM uploads, cache.
persistence:
  enabled: true
  storageClassName: local-path
  size: 5Gi
  accessMode: ReadWriteOnce
  mountPath: /var/www/webtrees/data

# Non-secret settings of the image's entrypoint, see the README of
# NathanVaughn/webtrees-docker. Passwords come from the SealedSecret as *_FILE,
# so they do not show up under "Server information" in the control panel.
# WT_* is only read on the very first start, when the database is empty.
env:
  LANG: "de"
  BASE_URL: "http://webtrees.homeserver"
  PRETTY_URLS: "1"
  HTTPS: "0"
  HTTPS_REDIRECT: "0"
  DB_TYPE: "mysql"
  DB_PORT: "3306"
  DB_USER: "webtrees"
  DB_NAME: "webtrees"
  DB_PREFIX: "wt_"
  WT_USER: "admin"
  WT_NAME: "Administrator"
  # Placeholder, no mail is sent. Change it in "Mein Konto" after the first login.
  WT_EMAIL: "admin@webtrees.homeserver"
  PHP_MEMORY_LIMIT: "1024M"
  PHP_MAX_EXECUTION_TIME: "300"
  PHP_POST_MAX_SIZE: "100M"
  PHP_UPLOAD_MAX_FILE_SIZE: "100M"

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    # PHP_MEMORY_LIMIT plus Apache; large GEDCOM imports need the headroom.
    memory: 1536Mi

# SealedSecret "webtrees" with the keys db-password, db-root-password and
# wt-password. Sealing: docs/27-webtrees.md.
sealedSecret:
  encryptedData:
    db-password: 
    db-root-password: 
    wt-password: 

mariadb:
  image:
    # 11.8 is the current LTS line. MARIADB_AUTO_UPGRADE runs mariadb-upgrade
    # when the data directory is from an older version.
    repository: docker.io/library/mariadb
    tag: "13.0.2"
    pullPolicy: IfNotPresent
  persistence:
    storageClassName: local-path
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Nightly logical dump into its own PVC, one hour before the restic backup
# (04:00) picks up all local-path volumes. The live InnoDB files in the backup
# are only crash-consistent; the dump is the clean restore point.
backup:
  enabled: true
  schedule: "30 3 * * *"
  keepDays: 14
  persistence:
    storageClassName: local-path
    size: 2Gi
