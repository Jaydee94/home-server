---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: questarr-config
  labels:
    {{- include "media.labels" "questarr" | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.config.storageClass }}
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: questarr
  labels:
    {{- include "media.labels" "questarr" | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: questarr
  template:
    metadata:
      labels:
        {{- include "media.labels" "questarr" | nindent 8 }}
    spec:
      containers:
        - name: questarr
          image: {{ .Values.images.questarr }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          # *arr-inspired game manager. Honours PUID/PGID (LinuxServer convention)
          # so the /data share (uid 1001) is writable for atomic import moves into
          # /data/games. entrypoint.sh chowns only /app + /app/data, never /data.
          # Wire it up in the UI: Prowlarr sync (http://prowlarr:9696) + SABnzbd
          # download client (http://sabnzbd:8080). SQLite (/app/data) stays on SSD.
          env:
            {{- include "media.lsioEnv" (dict "theme" "" "root" $) | nindent 12 }}
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.arr | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/data
            - name: media
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: questarr-config
        - name: media
          persistentVolumeClaim:
            claimName: mediastack-data
---
{{ include "media.svcIngress" (dict "name" "questarr" "port" 5000 "root" $) }}
