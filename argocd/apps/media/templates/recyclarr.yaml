{{- /*
Recyclarr: syncs the official TRaSH-Guides German (DL) quality profiles into
Sonarr + Radarr on a schedule, so language enforcement is reproducible from Git
instead of hand-clicked UI state (survives a config-PVC loss).

How German enforcement works (see docs/21-media-stack.md):
- The single "german-uhd-bluray-web" template (v8 config-templates) creates the
  profile "[German] UHD Bluray + WEB" (trash_id-referenced) with the German-DL
  custom-format score set: German-DL releases score far above English-only ones.
- All qualities are merged into ONE group ("Merged QPs"), so the language score
  decides upgrades — a German 1080p beats an English 2160p.
- min_format_score: 10000 makes non-German releases ungrabbable (strict mode).
  Existing English files are upgraded automatically once a German (DL) release
  is found by RSS or manual search.
- DV (w/o HDR fallback) is blocked via assign_scores_to on the profile
  trash_id — new IDs as of the current TRaSH database.

Template source (recyclarr/config-templates):
  sonarr/templates/german-uhd-bluray-web.yml  (trash_id 3b0fa37fddaaefc931b75f2889d4b4f5)
  radarr/templates/german-uhd-bluray-web.yml  (trash_id 27cc3d153c0a799fd139ef1ff4c4cc42)

Migration from v7 → v8 (Recyclarr 8.0, 2026-02-20):
  - Three partial includes replaced by one full template include per service.
  - Profile referenced by trash_id instead of name ("UHD Bluray + WEB (GER)"
    → "[German] UHD Bluray + WEB").
  - DV trash_ids updated to current values in TRaSH database.
*/ -}}
{{- if .Values.recyclarr.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  # Explicit (like the VMServiceScrape): Trivy renders the chart with the
  # "default" namespace, so Release.Namespace would not satisfy KSV-0110.
  # The ApplicationSet always deploys this folder into "media".
  namespace: media
  labels:
    {{- include "media.labels" "recyclarr" | nindent 4 }}
data:
  recyclarr.yml: |
    sonarr:
      sonarr:
        base_url: http://sonarr:8989
        api_key: !env_var SONARR_API_KEY
        quality_definition:
          type: series
        quality_profiles:
          - trash_id: 3b0fa37fddaaefc931b75f2889d4b4f5  # [German] UHD Bluray + WEB
            # Strict: skip English-only releases entirely.
            min_format_score: 10000
            reset_unmatched_scores:
              enabled: true
            # One merged tier so language score outranks resolution.
            qualities:
              - name: Merged QPs
                qualities:
                  - Bluray-2160p
                  - WEBDL-2160p
                  - WEBRip-2160p
                  - Bluray-1080p
                  - WEBDL-1080p
                  - WEBRip-1080p
                  - Bluray-720p
                  - WEBDL-720p
                  - WEBRip-720p
          # 1080p-capped variant for series whose 4K files don't play through Jellyfin.
          # Name-only (no trash_id) to avoid Recyclarr skipping the section on
          # duplicate trash_ids. German DL scores (German=10000, DL=11000, etc.)
          # were set via Sonarr API and are preserved because reset_unmatched_scores
          # is disabled — only the DV block below is actively managed here.
          - name: "[German] HD Bluray + WEB"
            min_format_score: 10000
            reset_unmatched_scores:
              enabled: false
            qualities:
              - name: Merged QPs
                qualities:
                  - Bluray-1080p
                  - WEBDL-1080p
                  - WEBRip-1080p
                  - Bluray-720p
                  - WEBDL-720p
                  - WEBRip-720p
        custom_formats:
          # Block DV-without-HDR-fallback (broken colors on non-DV displays).
          - trash_ids:
              - 9b27ab6498ec0f31a3353992e19434ca  # DV (w/o HDR fallback)
            assign_scores_to:
              - trash_id: 3b0fa37fddaaefc931b75f2889d4b4f5  # [German] UHD Bluray + WEB
              - name: "[German] HD Bluray + WEB"             # 1080p-capped variant
    radarr:
      radarr:
        base_url: http://radarr:7878
        api_key: !env_var RADARR_API_KEY
        quality_definition:
          type: movie
        quality_profiles:
          - trash_id: 27cc3d153c0a799fd139ef1ff4c4cc42  # [German] UHD Bluray + WEB
            min_format_score: 10000
            reset_unmatched_scores:
              enabled: true
            qualities:
              - name: Merged QPs
                qualities:
                  - Bluray-2160p
                  - WEBDL-2160p
                  - WEBRip-2160p
                  - Bluray-1080p
                  - WEBDL-1080p
                  - WEBRip-1080p
                  - Bluray-720p
                  - WEBDL-720p
                  - WEBRip-720p
        custom_formats:
          - trash_ids:
              - 923b6abef9b17f937fab56cfcf89e1f1  # DV (w/o HDR fallback)
            assign_scores_to:
              - trash_id: 27cc3d153c0a799fd139ef1ff4c4cc42  # [German] UHD Bluray + WEB
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: media
  labels:
    {{- include "media.labels" "recyclarr" | nindent 4 }}
spec:
  schedule: {{ .Values.recyclarr.schedule | quote }}
  timeZone: {{ .Values.timezone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            {{- include "media.labels" "recyclarr" | nindent 12 }}
        spec:
          restartPolicy: Never
          # Hardening like gameserver-ui: non-root high UID, seccomp, read-only
          # root FS. Recyclarr supports arbitrary UIDs; /config (emptyDir) is
          # made writable via fsGroup, /tmp gets its own emptyDir.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recyclarr
              image: {{ .Values.images.recyclarr }}
              imagePullPolicy: {{ .Values.images.pullPolicy }}
              args:
                - sync
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: TZ
                  value: {{ .Values.timezone | quote }}
                # Keep every write inside the two emptyDir mounts (read-only
                # root FS): config dir at /config, HOME for any
                # dotnet/tooling scratch at /tmp.
                # RECYCLARR_APP_DATA was removed in v8.0.0; use
                # RECYCLARR_CONFIG_DIR instead (data defaults to config dir).
                - name: RECYCLARR_CONFIG_DIR
                  value: /config
                - name: HOME
                  value: /tmp
                # Keys are REQUIRED (no optional:) — fail loudly instead of
                # syncing nothing. Seal them per docs/21 section 5.
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: media-api-keys
                      key: sonarr-api-key
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: media-api-keys
                      key: radarr-api-key
              resources:
                {{- toYaml .Values.resources.recyclarr | nindent 16 }}
              volumeMounts:
                - name: app-data
                  mountPath: /config
                - name: tmp
                  mountPath: /tmp
                - name: config
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
                  readOnly: true
          volumes:
            - name: app-data
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: config
              configMap:
                name: recyclarr-config
{{- end }}
