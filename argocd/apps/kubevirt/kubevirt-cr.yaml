---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  # useEmulation: true  # Uncomment ONLY if /dev/kvm is unavailable (nested virt, very slow)
  configuration:
    developerConfiguration:
      featureGates:
        - ExpandDisks
  # Single-node: 1 replica is sufficient for virt-api, virt-controller, virt-exportproxy.
  # HCO sets this automatically on SNO; on plain KubeVirt it must be explicit.
  infra:
    replicas: 1
  workloadUpdateStrategy: {}
