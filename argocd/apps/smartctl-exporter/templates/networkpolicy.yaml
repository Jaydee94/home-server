---
# The exporter pod is privileged. Its only consumer is vmagent, so the metrics
# port accepts connections from the monitoring namespace and nothing else.
# See docs/23-network-policies.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smartctl-exporter-namespace-isolation
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
