---
# Bootstrap-Issuer: erstellt das Root-CA-Zertifikat via self-signed.
# Wave 1 stellt sicher, dass cert-manager CRDs in Wave 0 registriert sind.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selfSigned: {}
