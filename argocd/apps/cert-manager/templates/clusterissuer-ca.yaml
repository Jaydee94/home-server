# Annotation: cert-manager.io/cluster-issuer: homeserver-ca-issuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homeserver-ca-issuer
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ca:
    secretName: homeserver-ca-secret
