{{- /*
Admin panel token (/admin), sealed as an Argon2 hash (see values.yaml comment
for the `vaultwarden hash` command). Skipped while empty so the repo lints and
the SealedSecrets controller does not error-loop on undecryptable data — the
admin panel simply stays unreachable until this is sealed.
*/ -}}
{{- if and .Values.adminToken.enabled .Values.adminToken.encryptedToken }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.adminToken.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
spec:
  encryptedData:
    token: {{ .Values.adminToken.encryptedToken | quote }}
  template:
    metadata:
      name: {{ .Values.adminToken.secretName }}
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
