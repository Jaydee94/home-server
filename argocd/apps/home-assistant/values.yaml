home-assistant:
  image:
    # Empty tag → chart default (stable). Pin to a digest here if reproducibility
    # is needed. Renovate watches the `appVersion` in Chart.yaml instead.
    tag: ""

  persistence:
    enabled: true
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 10Gi

  # Web UI at http://homeassistant.homeserver — Pi-hole wildcard *.homeserver
  # already resolves this to 192.168.178.127 (Traefik). No separate DNS entry needed.
  ingress:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - host: homeassistant.homeserver
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # GitOps-Installation der HA-Erweiterungen. Jeder Init-Container installiert das
  # gepinnte Release in den geteilten /config-PVC und merkt sich die installierte
  # Version in /config/.extension-versions/<name>.
  #   * Stimmt der Marker mit dem Pin überein, wird nichts geladen: der Pod startet
  #     auch ohne Internet/GitHub/DNS (Pi-hole läuft im selben Cluster, z. B. nach
  #     einem Stromausfall).
  #   * Scheitert der Download (neuer Pin oder noch kein Marker), bleibt die
  #     vorhandene Kopie liegen und der Pod startet mit ihr; der nächste Pod-Start
  #     versucht es erneut. Nur wenn noch gar keine Kopie existiert, schlägt der
  #     Init-Container fehl.
  #   * Geladen wird nach /tmp; das Ziel wird erst nach erfolgreichem Download
  #     ersetzt.
  # Renovate hält die Pins über den regex-Manager in renovate.json aktuell: die
  # "# renovate:"-Zeile über dem Container und die erste Zuweisung im Skript
  # gehören zusammen und dürfen nicht umformatiert werden.
  # Setup-Details: docs/17-homeassistant.md.
  initContainers:
    # Bubble-Card — Lovelace-Frontend-Ressource (#86). Bezieht die gebaute
    # dist/bubble-card.js aus dem Repo-Tree am Tag (kein Release-Asset, analog HACS
    # via hacs.json: content_in_root=false, filename=bubble-card.js).
    # renovate: datasource=github-releases depName=Clooos/Bubble-Card
    - name: install-bubble-card
      image: alpine:3.24
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          VERSION=3.4.3
          NAME=bubble-card
          DEST=/config/www/bubble-card.js
          MARKER="/config/.extension-versions/${NAME}"
          if [ -e "${DEST}" ] && [ "$(cat "${MARKER}" 2>/dev/null || true)" = "${VERSION}" ]; then
            echo "${NAME} ${VERSION} is already installed, skipping the download"
            exit 0
          fi
          if apk add --no-cache curl \
            && curl -fsSL "https://github.com/Clooos/Bubble-Card/raw/v${VERSION}/dist/bubble-card.js" -o "/tmp/${NAME}.js"; then
            mkdir -p "$(dirname "${DEST}")" /config/.extension-versions
            cp "/tmp/${NAME}.js" "${DEST}.new"
            mv "${DEST}.new" "${DEST}"
            echo "${VERSION}" > "${MARKER}"
            echo "${NAME} ${VERSION} installed"
          elif [ -e "${DEST}" ]; then
            echo "WARNING: download of ${NAME} ${VERSION} failed, keeping the installed copy ($(cat "${MARKER}" 2>/dev/null || echo "version unknown"))"
          else
            echo "ERROR: download of ${NAME} ${VERSION} failed and no copy is installed" >&2
            exit 1
          fi
      volumeMounts:
        - name: home-assistant
          mountPath: /config

    # Hourly Weather Card — Lovelace-Frontend-Ressource (#88). Tag ohne v-Präfix.
    # renovate: datasource=github-releases depName=decompil3d/lovelace-hourly-weather
    - name: install-hourly-weather
      image: alpine:3.24
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          VERSION=7.2.0
          NAME=hourly-weather
          DEST=/config/www/hourly-weather/hourly-weather.js
          MARKER="/config/.extension-versions/${NAME}"
          if [ -e "${DEST}" ] && [ "$(cat "${MARKER}" 2>/dev/null || true)" = "${VERSION}" ]; then
            echo "${NAME} ${VERSION} is already installed, skipping the download"
            exit 0
          fi
          if apk add --no-cache curl \
            && curl -fsSL "https://github.com/decompil3d/lovelace-hourly-weather/releases/download/${VERSION}/hourly-weather.js" -o "/tmp/${NAME}.js"; then
            mkdir -p "$(dirname "${DEST}")" /config/.extension-versions
            cp "/tmp/${NAME}.js" "${DEST}.new"
            mv "${DEST}.new" "${DEST}"
            echo "${VERSION}" > "${MARKER}"
            echo "${NAME} ${VERSION} installed"
          elif [ -e "${DEST}" ]; then
            echo "WARNING: download of ${NAME} ${VERSION} failed, keeping the installed copy ($(cat "${MARKER}" 2>/dev/null || echo "version unknown"))"
          else
            echo "ERROR: download of ${NAME} ${VERSION} failed and no copy is installed" >&2
            exit 1
          fi
      volumeMounts:
        - name: home-assistant
          mountPath: /config

    # AI Automation Suggester — Python-Custom-Integration (#89)
    # renovate: datasource=github-releases depName=ITSpecialist111/ai_automation_suggester
    - name: install-ai-automation-suggester
      image: alpine:3.24
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          VERSION=1.7.0
          NAME=ai_automation_suggester
          DEST="/config/custom_components/${NAME}"
          MARKER="/config/.extension-versions/${NAME}"
          SRC="/tmp/ai_automation_suggester-${VERSION}/custom_components/${NAME}"
          STAGE="/config/.extension-versions/.staging-${NAME}"
          if [ -d "${DEST}" ] && [ "$(cat "${MARKER}" 2>/dev/null || true)" = "${VERSION}" ]; then
            echo "${NAME} ${VERSION} is already installed, skipping the download"
            exit 0
          fi
          if apk add --no-cache curl tar \
            && curl -fsSL "https://github.com/ITSpecialist111/ai_automation_suggester/archive/refs/tags/v${VERSION}.tar.gz" -o "/tmp/${NAME}.tgz" \
            && tar -xzf "/tmp/${NAME}.tgz" -C /tmp \
            && [ -d "${SRC}" ]; then
            mkdir -p /config/custom_components /config/.extension-versions
            rm -rf "${STAGE}"
            cp -r "${SRC}" "${STAGE}"
            rm -rf "${DEST}"
            mv "${STAGE}" "${DEST}"
            echo "${VERSION}" > "${MARKER}"
            echo "${NAME} ${VERSION} installed"
          elif [ -d "${DEST}" ]; then
            echo "WARNING: download of ${NAME} ${VERSION} failed, keeping the installed copy ($(cat "${MARKER}" 2>/dev/null || echo "version unknown"))"
          else
            echo "ERROR: download of ${NAME} ${VERSION} failed and no copy is installed" >&2
            exit 1
          fi
      volumeMounts:
        - name: home-assistant
          mountPath: /config

    # Dreame Vacuum — Python-Custom-Integration für Dreame D9 Max (#90)
    # renovate: datasource=github-releases depName=Tasshack/dreame-vacuum
    - name: install-dreame-vacuum
      image: alpine:3.24
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          VERSION=2.0.3
          NAME=dreame_vacuum
          DEST="/config/custom_components/${NAME}"
          MARKER="/config/.extension-versions/${NAME}"
          SRC="/tmp/dreame-vacuum-${VERSION}/custom_components/${NAME}"
          STAGE="/config/.extension-versions/.staging-${NAME}"
          if [ -d "${DEST}" ] && [ "$(cat "${MARKER}" 2>/dev/null || true)" = "${VERSION}" ]; then
            echo "${NAME} ${VERSION} is already installed, skipping the download"
            exit 0
          fi
          if apk add --no-cache curl tar \
            && curl -fsSL "https://github.com/Tasshack/dreame-vacuum/archive/refs/tags/v${VERSION}.tar.gz" -o "/tmp/${NAME}.tgz" \
            && tar -xzf "/tmp/${NAME}.tgz" -C /tmp \
            && [ -d "${SRC}" ]; then
            mkdir -p /config/custom_components /config/.extension-versions
            rm -rf "${STAGE}"
            cp -r "${SRC}" "${STAGE}"
            rm -rf "${DEST}"
            mv "${STAGE}" "${DEST}"
            echo "${VERSION}" > "${MARKER}"
            echo "${NAME} ${VERSION} installed"
          elif [ -d "${DEST}" ]; then
            echo "WARNING: download of ${NAME} ${VERSION} failed, keeping the installed copy ($(cat "${MARKER}" 2>/dev/null || echo "version unknown"))"
          else
            echo "ERROR: download of ${NAME} ${VERSION} failed and no copy is installed" >&2
            exit 1
          fi
      volumeMounts:
        - name: home-assistant
          mountPath: /config

  configuration:
    enabled: true
    forceInit: true
    trusted_proxies:
      - 10.42.0.0/16
      - 127.0.0.1

  env:
    - name: TZ
      value: Europe/Berlin

  securityContext:
    privileged: true

  additionalVolumes:
    - name: zigbee-dongle
      hostPath:
        path: /dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Plus_MG24_46718ac707a3ef11a29a8c6661ce3355-if00-port0
        type: CharDevice
    # Midnight-Theme (#91) — als einzelne Datei nach /config/themes/midnight.yaml
    - name: theme-midnight
      configMap:
        name: ha-theme-midnight

  additionalMounts:
    - name: zigbee-dongle
      mountPath: /dev/ttyUSB0
    - name: theme-midnight
      mountPath: /config/themes/midnight.yaml
      subPath: midnight.yaml

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
