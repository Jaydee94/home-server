# Single source of truth for the bootstrap ApplicationSet.
# The committed copy at argocd/bootstrap/root-applicationset.yaml is GENERATED
# from this template — run `make render-bootstrap` after editing this file or
# the argocd_repo_* / argocd_namespace vars in group_vars. Do not hand-edit the
# committed copy.
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: home-server-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: "https://github.com/Jaydee94/home-server.git"
        revision: "main"
        directories:
          - path: "argocd/apps/*"
  template:
    metadata:
      name: "{{.path.basename}}"
    spec:
      project: default
      source:
        repoURL: "https://github.com/Jaydee94/home-server.git"
        targetRevision: "main"
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # CRD/CR bootstrap (e.g. victoria-metrics-operator installs the
        # VMSingle CRD and a VMSingle resource in one sync) needs the
        # dry-run skip + retry to converge on the first reconciliation.
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
          - RespectIgnoreDifferences=true
      # Kubernetes adds volumeMode: Filesystem and persistentVolumeClaimRetentionPolicy
      # as defaults to StatefulSet — ignore these immutable/defaulted fields to prevent
      # drift loops. KubeVirt VM runStrategy is managed by scheduled CronJobs, not ArgoCD.
      # KubeVirt also injects domain.machine (q35) and domain.firmware (uuid) at admission.
      # Kubernetes adds spec.conversion to CRDs — ignore to suppress CDI CRD drift.
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - .spec.volumeClaimTemplates[]?.spec.volumeMode
            # Kubernetes injects apiVersion/kind/status into VCT entries at admission;
            # these fields are absent in Helm templates — ignore to prevent drift loops.
            - .spec.volumeClaimTemplates[]?.status
            - .spec.volumeClaimTemplates[]?.apiVersion
            - .spec.volumeClaimTemplates[]?.kind
            # kubectl rollout restart sets this annotation via its own field-manager;
            # ArgoCD SSA cannot remove it — ignore to prevent drift loops.
            - .spec.template.metadata.annotations["kubectl.kubernetes.io/restartedAt"]
          jsonPointers:
            - /spec/persistentVolumeClaimRetentionPolicy
            # Helm checksum annotations are computed from ConfigMap content at render time.
            # ArgoCD SSA cannot overwrite them (field-manager conflict from original helm install).
            # Checksums diverge when a sub-chart version bumps without re-deploying via helm.
            # Ignore to stop drift loops; ConfigMap changes still sync, only auto-restart is lost.
            - /spec/template/metadata/annotations/checksum~1config
            - /spec/template/metadata/annotations/checksum~1acl
            - /spec/template/metadata/annotations/checksum~1secret
            - /spec/template/metadata/annotations/checksum~1init-script
            - /spec/template/metadata/annotations/checksum~1hass-configuration
        - group: kubevirt.io
          kind: VirtualMachine
          jsonPointers:
            - /spec/runStrategy
            - /spec/template/metadata/annotations
            - /spec/template/spec/domain/machine
            - /spec/template/spec/domain/firmware
            # Kubernetes normalises memory quantities (e.g. 8.5Gi → 8704Mi) at admission;
            # ignore to prevent spurious drift when both values are numerically equal.
            - /spec/template/spec/domain/resources
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/conversion
            - /status
            # CDI/KubeVirt operators continuously reconcile CRD versions (generation > 28000);
            # ArgoCD cannot win against the operator — ignore to stop the drift loop.
            - /spec/versions
