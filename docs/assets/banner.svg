<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="1600" height="360" role="img" aria-label="home-server">
  <title>home-server</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#060d1a"/>
      <stop offset="50%" stop-color="#0c1628"/>
      <stop offset="100%" stop-color="#070f1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6d28d9"/>
      <stop offset="50%"  stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6d28d9"/>
      <stop offset="50%"  stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#6d28d9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.04"/>
    </pattern>
    <filter id="blur12">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="360" fill="url(#bg)"/>
  <rect width="1600" height="360" fill="url(#grid)"/>

  <!-- Ambient glows -->
  <ellipse cx="250" cy="180" rx="300" ry="260" fill="url(#glow2)" filter="url(#blur12)"/>
  <ellipse cx="1380" cy="180" rx="260" ry="220" fill="url(#glow1)" filter="url(#blur12)"/>

  <!-- Central hexagon logo -->
  <g transform="translate(232,182)">
    <circle r="162" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="6 8" opacity="0.5"/>
    <polygon points="0,-130 112.6,-65 112.6,65 0,130 -112.6,65 -112.6,-65"
             fill="none" stroke="url(#accentV)" stroke-width="3.5" opacity="0.9"/>
    <polygon points="0,-108 93.5,-54 93.5,54 0,108 -93.5,54 -93.5,-54"
             fill="#0b1628" stroke="#1e3056" stroke-width="1.5"/>
    <!-- House + rack icon -->
    <g stroke="url(#accentV)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -52 -4 L 0 -52 L 52 -4"/>
      <path d="M -42 -4 L -42 54 L 42 54 L 42 -4"/>
      <line x1="-24" y1="13" x2="24" y2="13"/>
      <line x1="-24" y1="30" x2="24" y2="30"/>
    </g>
    <circle cx="20" cy="13" r="4" fill="#22d3ee"/>
    <circle cx="20" cy="30" r="4" fill="#a78bfa"/>
  </g>

  <!-- Wordmark -->
  <g font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="420" y="166" font-size="102" font-weight="800" letter-spacing="-4" fill="#f1f5f9">home</text>
    <text x="775" y="166" font-size="102" font-weight="800" fill="url(#accent)">·</text>
    <text x="808" y="166" font-size="102" font-weight="800" letter-spacing="-4" fill="#f1f5f9">server</text>
  </g>

  <!-- Pipeline connector lines -->
  <g stroke="url(#wire)" stroke-width="1.5" fill="none" opacity="0.7">
    <line x1="467" y1="284" x2="554" y2="284"/>
    <line x1="602" y1="284" x2="694" y2="284"/>
    <line x1="742" y1="284" x2="834" y2="284"/>
    <line x1="882" y1="284" x2="974" y2="284"/>
    <line x1="1022" y1="284" x2="1114" y2="284"/>
    <line x1="1162" y1="284" x2="1254" y2="284"/>
  </g>

  <!-- Node: Git -->
  <g transform="translate(420,284)">
    <circle r="44" fill="#0b1628" stroke="#1e40af" stroke-width="1.5"/>
    <circle cx="0" cy="-14" r="6" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
    <circle cx="-16" cy="10" r="6" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
    <circle cx="16" cy="10" r="6" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
    <line x1="0" y1="-8" x2="0" y2="4" stroke="#93c5fd" stroke-width="2"/>
    <path d="M 0 4 Q 0 10 -16 10" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <path d="M 0 4 Q 0 10 16 10" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <text y="68" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#475569">git</text>
  </g>

  <!-- Node: Ansible -->
  <g transform="translate(578,284)">
    <circle r="44" fill="#0b1628" stroke="#7f1d1d" stroke-width="1.5"/>
    <polygon points="0,-24 20,0 0,24 -20,0" fill="none" stroke="#f87171" stroke-width="2"/>
    <text y="10" text-anchor="middle" font-family="'Arial Black',sans-serif" font-size="22" font-weight="900" fill="#f87171">A</text>
    <text y="68" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#475569">ansible</text>
  </g>

  <!-- Node: k3s / Kubernetes -->
  <g transform="translate(738,284)">
    <circle r="44" fill="#0b1628" stroke="#0e7490" stroke-width="1.5"/>
    <circle r="22" fill="none" stroke="#67e8f9" stroke-width="2"/>
    <circle r="6" fill="#67e8f9"/>
    <line x1="0" y1="-22" x2="0" y2="-6"  stroke="#67e8f9" stroke-width="2"/>
    <line x1="0" y1="6"   x2="0" y2="22"   stroke="#67e8f9" stroke-width="2"/>
    <line x1="-22" y1="0" x2="-6" y2="0"  stroke="#67e8f9" stroke-width="2"/>
    <line x1="6"   y1="0" x2="22" y2="0"   stroke="#67e8f9" stroke-width="2"/>
    <line x1="-15.6" y1="-15.6" x2="-4.2" y2="-4.2" stroke="#67e8f9" stroke-width="2"/>
    <line x1="4.2"   y1="4.2"   x2="15.6" y2="15.6"  stroke="#67e8f9" stroke-width="2"/>
    <line x1="15.6"  y1="-15.6" x2="4.2"  y2="-4.2"  stroke="#67e8f9" stroke-width="2"/>
    <line x1="-4.2"  y1="4.2"   x2="-15.6" y2="15.6" stroke="#67e8f9" stroke-width="2"/>
    <text y="68" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#475569">k3s</text>
  </g>

  <!-- Node: ArgoCD -->
  <g transform="translate(898,284)">
    <circle r="44" fill="#0b1628" stroke="#7c3aed" stroke-width="1.5"/>
    <path d="M 0 -20 A 20 20 0 1 1 -14.1 14.1" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="-14.1,14.1 -22,6 -6,6" fill="#c4b5fd"/>
    <text y="68" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#475569">argocd</text>
  </g>

  <!-- Node: Tailscale -->
  <g transform="translate(1058,284)">
    <circle r="44" fill="#0b1628" stroke="#1d4ed8" stroke-width="1.5"/>
    <circle cx="0"   cy="-16" r="4.5" fill="#93c5fd"/>
    <circle cx="-16" cy="10"  r="4.5" fill="#93c5fd"/>
    <circle cx="16"  cy="10"  r="4.5" fill="#93c5fd"/>
    <circle cx="0"   cy="4"   r="4.5" fill="#93c5fd" opacity="0.6"/>
    <line x1="0"   y1="-16" x2="-16" y2="10"  stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
    <line x1="0"   y1="-16" x2="16"  y2="10"  stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
    <line x1="-16" y1="10"  x2="16"  y2="10"  stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
    <line x1="0"   y1="-16" x2="0"   y2="4"   stroke="#93c5fd" stroke-width="1.5" opacity="0.4"/>
    <line x1="-16" y1="10"  x2="0"   y2="4"   stroke="#93c5fd" stroke-width="1.5" opacity="0.4"/>
    <line x1="16"  y1="10"  x2="0"   y2="4"   stroke="#93c5fd" stroke-width="1.5" opacity="0.4"/>
    <text y="68" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#475569">tailscale</text>
  </g>

  <!-- Node: Home Assistant -->
  <g transform="translate(1218,284)">
    <circle r="44" fill="#0b1628" stroke="#065f46" stroke-width="1.5"/>
    <circle r="20" fill="none" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M -10 2 L 0 -10 L 10 2 L 10 12 L -10 12 Z" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linejoin="round"/>
    <line x1="-2" y1="12" x2="-2" y2="6" stroke="#6ee7b7" stroke-width="2"/>
    <line x1="2"  y1="12" x2="2"  y2="6" stroke="#6ee7b7" stroke-width="2"/>
    <text y="68" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#475569">home·assistant</text>
  </g>

  <!-- Node: MQTT -->
  <g transform="translate(1378,284)">
    <circle r="44" fill="#0b1628" stroke="#6b4c00" stroke-width="1.5"/>
    <circle cx="0" cy="4" r="5" fill="#fbbf24"/>
    <path d="M -14 -8 A 17 17 0 0 1 14 -8" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -24 -18 A 27 27 0 0 1 24 -18" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <text y="68" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#475569">mqtt</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="354" width="1600" height="3" fill="url(#accent)" opacity="0.8"/>
</svg>
